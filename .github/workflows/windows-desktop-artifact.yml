name: Windows Desktop Artifact

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Desktop doctor
        run: bun run desktop:doctor

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push local SQLite schema
        run: bun run db:push

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Static desktop audit
        run: bun run desktop:static:audit

      - name: Static desktop build
        run: bun run desktop:static:build

      - name: Static desktop smoke
        run: bun run desktop:static:smoke

      - name: Build unsigned Tauri artifact
        run: bun run desktop:tauri:build

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealmsOfWar-windows-unsigned
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

