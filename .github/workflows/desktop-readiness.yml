name: Desktop Readiness

on:
  workflow_dispatch:

jobs:
  static-desktop:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Desktop doctor
        run: bun run desktop:doctor

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push local SQLite schema
        run: bun run db:push

      - name: Static desktop audit
        run: bun run desktop:static:audit

      - name: Static desktop build
        run: bun run desktop:static:build

      - name: Static desktop smoke
        run: bun run desktop:static:smoke
