// [PATCH 2] keydown: guard gameover + isInputAllowed для действий
document.addEventListener('keydown',e=>{
  if(S.phase==='gameover')return;
  const sp=30;
  if(e.key==='ArrowLeft')S.cam.x-=sp;else if(e.key==='ArrowRight')S.cam.x+=sp;
  else if(e.key==='ArrowUp')S.cam.y-=sp;else if(e.key==='ArrowDown')S.cam.y+=sp;
  else if(e.key==='Escape'){
    const techOverlay=document.getElementById('tech-overlay');
    if(techOverlay.style.display!=='none'){
      techOverlay.style.display='none';
    }else if(S.phase==='recruiting'){hideRecruitMenu();}
    else{S.selectedUnit=null;clearHL();updateUI();}
  }
  else if(e.key==='t'||e.key==='T'){
    const techOverlay=document.getElementById('tech-overlay');
    if(techOverlay.style.display==='none'){
      techOverlay.style.display='block';
      renderTechTree();
    }else{
      techOverlay.style.display='none';
    }
  }
  else if(e.key==='r'||e.key==='R'){
    if(S.phase==='recruiting'){hideRecruitMenu();}
    else if(isInputAllowed()){
      // Try to open recruit menu for building under hover/click
      const hq=S.hoverHex;
      if(hq){
        const b=S.buildings.find(b=>b.q===hq.q&&b.r===hq.r);
        if(b&&BT[b.type].canRecruit&&BT[b.type].recruits&&BT[b.type].recruits.length){
          showRecruitMenu(b.q,b.r);
        }
      }
    }
  }
  else if(e.key==='b'||e.key==='B'){if(isInputAllowed())tryBuildMode();}
  clampCam();
});

// [PATCH 2+4] handleClick: guard isInputAllowed, расход u.move по стоимости пути
function handleClick(q,r){
  if(!isInputAllowed())return;
  const clickedUnit=S.units.find(u=>u.q===q&&u.r===r);
  const clickedBuilding=S.buildings.find(b=>b.q===q&&b.r===r);
  const k=hexKey(q,r);

  // Режим строительства
  if(buildMode){
    if(canBuild(buildMode,q,r)){build(buildMode,q,r);buildMode=null;computeThreats();return;}
    else{addLog('Нельзя строить здесь!','enemy');buildMode=null;return;}
  }

  if(S.selectedUnit){
    const su=S.selectedUnit;
    // [PATCH 4] Проверка su.move>0 вместо !su.moved, вычитание стоимости
    if(S.moveHighlights.has(k)&&su.move>0){
      const cost=S.lastCostMap[k]||1;
      const oldQ=su.q,oldR=su.r;
      // Set facing direction based on movement
      if(q>oldQ||(q===oldQ&&r>oldR))su.facing=1; else su.facing=-1;
      su.q=q;su.r=r;su.move=Math.max(0,su.move-cost);su.moved=true;
      su.walkAnim=12; // walk animation frames
      addEffect({type:'trail',fromQ:oldQ,fromR:oldR,toQ:q,toR:r,t:0,maxT:15});
      addLog(`${su.name} \u2192 (${q},${r}) (-${cost} ход)`,'player');
      const cell=S.map[k];
      if(cell&&cell.terrain===TERRAIN.RUINS){
        const g=10+Math.floor(Math.random()*15);S.res.gold+=g;S.pp+=5;
        addLog(`Руины! +${g} золота, +5 ОП`,'system');cell.terrain=TERRAIN.PLAINS;
      }
      clearHL();
      // [PATCH 4] Если ещё есть ход — пересчитать доступные клетки
      if(su.move>0&&!su.attacked){
        const{moveCells,attackCells,costMap}=findReachable(su);
        S.moveHighlights=moveCells;S.attackHighlights=attackCells;S.lastCostMap=costMap;
        // [TASK 6] Compute max-reach boundary after partial move
        S.maxReachHighlights=computeMaxReach(su,costMap);
      }else if(!su.attacked){
        const t=findAttackTargets(su);
        if(t.length)S.attackHighlights=new Set(t.map(x=>hexKey(x.q,x.r)));
      }
      computeThreats();updateUI();return;
    }
    if(S.attackHighlights.has(k)&&!su.attacked){
      const target=S.units.find(u=>u.q===q&&u.r===r&&u.team!==su.team);
      if(target){combat(su,target);computeThreats();return;}
    }
    // [TASK 1] Click priority: unit -> building -> tile
    if(clickedUnit&&clickedUnit.team==='player'){selectUnit(clickedUnit);return;}
    if(clickedUnit&&clickedUnit.team==='enemy'){
      // Show enemy unit info in the unit-info panel
      showEnemyInfo(clickedUnit);return;
    }
    S.selectedUnit=null;clearHL();updateUI();return;
  }

  // [TASK 1] No unit selected: priority unit -> building -> tile
  if(clickedUnit&&clickedUnit.team==='player')selectUnit(clickedUnit);
  else if(clickedUnit&&clickedUnit.team==='enemy')showEnemyInfo(clickedUnit);
  else if(clickedBuilding&&BT[clickedBuilding.type].canRecruit&&!clickedUnit){
    // Building with recruits and no unit on it
    const bt=BT[clickedBuilding.type];
    if(bt.recruits&&bt.recruits.length){
      showRecruitMenu(q,r);
    } else {
      addLog(`Здание: ${clickedBuilding.name} — нажмите R для найма`,'system');
    }
    updateCellInfo(q,r);
  }
  else updateCellInfo(q,r);
}

// [PATCH 4] selectUnit: проверка u.move>0 вместо !u.moved, сохранение costMap
function selectUnit(u){
  S.selectedUnit=u;clearHL();
  if(u.move>0){const{moveCells,attackCells,costMap}=findReachable(u);
    S.moveHighlights=moveCells;S.attackHighlights=attackCells;S.lastCostMap=costMap;
    // [TASK 6] Compute max-reach boundary
    S.maxReachHighlights=computeMaxReach(u,costMap);
  }
  else if(!u.attacked){const t=findAttackTargets(u);S.attackHighlights=new Set(t.map(x=>hexKey(x.q,x.r)));}
  updateUI();
}


// [TASK 2+3] Compute threat zones: all hexes attackable by enemy units
function computeThreats(){
  S.threatHighlights=new Set();
  S.units.filter(u=>u.team==='enemy'&&u.hp>0).forEach(e=>{
    // Melee/ranged: all hexes within range
    for(let dq=-e.range;dq<=e.range;dq++){
      for(let dr=Math.max(-e.range,-dq-e.range);dr<=Math.min(e.range,-dq+e.range);dr++){
        const tq=e.q+dq,tr=e.r+dr;
        if(tq===e.q&&tr===e.r)continue;
        const cell=S.map[hexKey(tq,tr)];
        if(cell)S.threatHighlights.add(hexKey(tq,tr));
      }
    }
  });
}

// [TASK 1] Show enemy unit info in the sidebar unit-info panel
function showEnemyInfo(u){
  const ud=document.getElementById('unit-info');
  ud.innerHTML='';
  const h3=document.createElement('h3');
  h3.textContent=u.name+' [Враг]';
  h3.style.color='#e94560';
  ud.appendChild(h3);
  const stats=document.createElement('div');
  stats.className='stats';
  const statData=[
    ['HP:',u.hp+'/'+u.maxHp],
    ['Атака:',u.atk],
    ['Защита:',u.def],
    ['Дальность:',u.range],
  ];
  statData.forEach(([label,val])=>{
    const sl=document.createElement('span');sl.className='stat-label';sl.textContent=label;
    const sv=document.createElement('span');sv.className='stat-val';sv.textContent=String(val);
    stats.appendChild(sl);stats.appendChild(sv);
  });
  ud.appendChild(stats);
  updateCellInfo(u.q,u.r);
}
function clearHL(){S.moveHighlights=new Set();S.attackHighlights=new Set();S.threatHighlights=new Set();S.pathHighlights=new Set();S.recruitHighlights=new Set();S.pathCostMap={};S.maxReachHighlights=new Set();}

function clampCam(){
  const mw=COLS*HEX_W+200,mh=ROWS*HEX_H+200;
  S.cam.x=Math.max(-200,Math.min(mw-canvas.width,S.cam.x));
  S.cam.y=Math.max(-200,Math.min(mh-canvas.height,S.cam.y));
}

    const canBarracks=canBuild('barracks',u.q,u.r);
    const canLibrary=canBuild('library',u.q,u.r);
    bb.disabled=!canBarracks&&!canLibrary;
    bb.textContent=canBarracks?'Строить (Казармы)':canLibrary?'Строить (Библиотека)':'Строить';
  }else{bb.disabled=true;bb.textContent='Строить';}
}

// ============================================================
// ТЕХНОЛОГИИ: РЕНДЕРИНГ ДЕРЕВА
// ============================================================
function renderTechTree(){
  const overlay=document.getElementById('tech-overlay');
  const tc=document.getElementById('tech-canvas');
  const tctx=tc.getContext('2d');
  tc.width=window.innerWidth;
  tc.height=window.innerHeight;
  tctx.fillStyle='#0a0a1a';
  tctx.fillRect(0,0,tc.width,tc.height);

  const nodeW=140,nodeH=55,gapY=15;
  const epochX=[40,220,400,580,760];
  const epochHeaders=['Эпоха 0','Эпоха I','Эпоха II','Эпоха III','Эпоха IV'];

  // Header
  tctx.fillStyle='#e0c97f';tctx.font='bold 16px Segoe UI,Arial';tctx.textAlign='center';
  tctx.fillText('ДЕРЕВО ТЕХНОЛОГИЙ',tc.width/2,25);
  tctx.font='11px Segoe UI,Arial';tctx.fillStyle='#8a9bb5';
  tctx.fillText(`Эпоха: ${S.epoch} | ОП: ${S.pp} | Наука/ход: ${getSciencePerTurn()}`,tc.width/2,42);

  // Epoch headers
  epochHeaders.forEach((name,i)=>{
    tctx.fillStyle=S.epoch>=i?'#e0c97f':'#555';
    tctx.font='bold 10px Segoe UI,Arial';tctx.textAlign='center';
    tctx.fillText(name,epochX[i]+nodeW/2,62);
  });

  // Layout nodes by epoch
  const nodes={};
  const epochBuckets=[[],[],[],[],[]];
  Object.values(TECHS).forEach(t=>epochBuckets[t.epoch].push(t));

  const startY=80;
  epochBuckets.forEach((bucket,epoch)=>{
    bucket.forEach((tech,idx)=>{
      nodes[tech.id]={
        x:epochX[epoch],
        y:startY+idx*(nodeH+gapY),
        w:nodeW,h:nodeH,tech
      };
    });
  });

  // Draw connections
  tctx.lineWidth=2;
  Object.values(nodes).forEach(node=>{
    node.tech.requires.forEach(reqId=>{
      const parent=nodes[reqId];
      if(!parent)return;
      const fromX=parent.x+parent.w,fromY=parent.y+parent.h/2;
      const toX=node.x,toY=node.y+node.h/2;
      tctx.strokeStyle=S.researched.has(reqId)?'#53d8fb':'#333';
      tctx.beginPath();
      tctx.moveTo(fromX,fromY);
      tctx.bezierCurveTo(fromX+40,fromY,toX-40,toY,toX,toY);
      tctx.stroke();
    });
  });

  // Draw nodes — store positions for click detection
  window._techNodePositions=nodes;

  Object.values(nodes).forEach(node=>{
    const{x,y,w,h,tech}=node;
    const status=getTechStatus(tech.id);
    const isCurrent=S.currentResearch===tech.id;

    // Background
    const bgColors={
      researched:'#1a5a10',researching:'#2a4a10',available:'#1b2838',
      'epoch-locked':'#111',locked:'#0d1117',expensive:'#1b2028'
    };
    tctx.fillStyle=bgColors[status.status]||'#0d1117';
    const borderColors={
      researched:'#2ecc71',researching:'#f39c12',available:'#e0c97f',
      'epoch-locked':'#333',locked:'#444',expensive:'#c0392b'
    };
    tctx.strokeStyle=borderColors[status.status]||'#333';
    tctx.lineWidth=isCurrent?3:status.status==='researched'?2:1;

    // Rounded rect
    const r=6;
    tctx.beginPath();
    tctx.moveTo(x+r,y);tctx.lineTo(x+w-r,y);tctx.quadraticCurveTo(x+w,y,x+w,y+r);
    tctx.lineTo(x+w,y+h-r);tctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    tctx.lineTo(x+r,y+h);tctx.quadraticCurveTo(x,y+h,x,y+h-r);
    tctx.lineTo(x,y+r);tctx.quadraticCurveTo(x,y,x+r,y);
    tctx.closePath();tctx.fill();tctx.stroke();

    // Name
    const textColors={researched:'#2ecc71',researching:'#f39c12',available:'#e0c97f',
      'epoch-locked':'#555',locked:'#667',expensive:'#c0392b'};
    tctx.fillStyle=textColors[status.status]||'#667';
    tctx.font='bold 11px Segoe UI,Arial';tctx.textAlign='center';tctx.textBaseline='middle';
    tctx.fillText(tech.name,x+w/2,y+h/2-8);

    // Cost/status
    tctx.font='9px Segoe UI,Arial';tctx.fillStyle='#8a9bb5';
    const statusText={
      researched:'✓ Изучено',researching:`${S.researchProgress}/${tech.cost} ОП`,
      available:`ОП: ${tech.cost}`,'epoch-locked':`Эпоха ${tech.epoch}`,
      locked:`Нужен: ${tech.requires.map(r=>TECHS[r]?.name||r).join(', ')}`,
      expensive:`ОП: ${tech.cost} (мало)`
    };
    tctx.fillText(statusText[status.status]||'',x+w/2,y+h/2+8);

    // Effect
    tctx.font='8px Segoe UI,Arial';tctx.fillStyle='#667';
    tctx.fillText(tech.effect.substring(0,25),x+w/2,y+h/2+20);
  });
}

// [PATCH 2] checkVictory: отмена таймеров, проверка hp>0
function checkVictory(){
  const enemiesAlive=S.units.filter(u=>u.team==='enemy'&&u.hp>0).length;
  const playersAlive=S.units.filter(u=>u.team==='player'&&u.hp>0).length;
  if(!enemiesAlive){
    addLog('ПОБЕДА!','system');S.phase='gameover';
    if(_enemyTurnTimer!==null){clearTimeout(_enemyTurnTimer);_enemyTurnTimer=null;}
    setTimeout(()=>showGameOver(true),200);
  }else if(!playersAlive){
    addLog('ПОРАЖЕНИЕ!','system');S.phase='gameover';
    if(_enemyTurnTimer!==null){clearTimeout(_enemyTurnTimer);_enemyTurnTimer=null;}
    setTimeout(()=>showGameOver(false),200);
  }
}

// ============================================================
// [TASK 9] GAME OVER OVERLAY
// ============================================================
function showGameOver(victory){
  const overlay=document.getElementById('gameover-overlay');
  const title=document.getElementById('gameover-title');
  const subtitle=document.getElementById('gameover-subtitle');
  const stats=document.getElementById('gameover-stats');

  if(victory){
    title.textContent='ПОБЕДА!';
    title.style.color='#e0c97f';
    subtitle.textContent='Все враги уничтожены!';
  }else{
    title.textContent='ПОРАЖЕНИЕ';
    title.style.color='#e94560';
    subtitle.textContent='Все ваши юниты уничтожены...';
  }

  stats.innerHTML=
    `Ходов: ${S.turn}<br>`+
    `Юнитов уничтожено: ${S.stats.unitsKilled}<br>`+
    `Технологий изучено: ${S.researched.size}<br>`+
    `Эпоха: ${S.epoch} — ${EPOCH_NAMES[S.epoch]}<br>`+
    `Зданий построено: ${S.buildings.length}`;

  overlay.classList.add('visible');
  updatePhaseIndicator();
}

document.getElementById('btn-restart').addEventListener('click',()=>location.reload());

// ============================================================
// [TASK 9] PROJECT INCOME
// ============================================================
function projectIncome(){
  let fg=0,fd=0;
  S.units.filter(u=>u.team==='player').forEach(u=>{
    const t=S.map[hexKey(u.q,u.r)]?.terrain;
    if(t===TERRAIN.DESERT)fg++;if(t===TERRAIN.PLAINS||t===TERRAIN.HILLS)fd++;
  });
  let buildingOP=0;
  S.buildings.forEach(b=>{buildingOP+=BT[b.type].opp;});
  let goldIncome=fg+3;
  let foodIncome=fd+2;
  let ppIncome=2+buildingOP;

  if(S.researched.has('gathering'))foodIncome+=countTerrain(TERRAIN.PLAINS);
  if(S.researched.has('agriculture'))foodIncome+=2;
  if(S.researched.has('campfires'))ppIncome+=1;
  if(S.researched.has('religion'))ppIncome+=2;
  if(S.researched.has('education'))ppIncome+=2;
  if(S.researched.has('alchemy'))ppIncome+=3;

  return {gold:goldIncome,food:foodIncome,pp:ppIncome,science:getSciencePerTurn()};
}

// ============================================================
// [TASK 9] PHASE INDICATOR & INPUT LOCK FEEDBACK
// ============================================================
function updatePhaseIndicator(){
  const indicator=document.getElementById('phase-indicator');
  const dim=document.getElementById('canvas-dim');
  indicator.className='';
  indicator.textContent='';

  if(S.phase==='enemy'||S.phase==='enemy-turn-pending'){
    indicator.textContent='⟳ Ход противника...';
    indicator.className='enemy-turn';
    canvas.style.cursor='default';
    dim.style.display='none';
  }else if(S.phase==='recruiting'){
    indicator.textContent='Найм юнитов';
    indicator.className='recruiting-phase';
    canvas.style.cursor='default';
    dim.style.display='block';
  }else if(S.phase==='gameover'){
    indicator.style.display='none';
    dim.style.display='none';
    canvas.style.cursor='default';
    return;
  }else{
    // player phase
    indicator.style.display='none';
    dim.style.display='none';
    canvas.style.cursor='pointer';
  }
}

let _toastTimer=null;
function showTurnToast(text){
  const toast=document.getElementById('turn-toast');

  _toastTimer=setTimeout(()=>{
    toast.classList.remove('show');
    _toastTimer=null;
  },2000);
}

// ============================================================
// RECRUIT MODAL: Show/Hide + Card rendering
// ============================================================
function showRecruitMenu(buildingQ,buildingR){
  const building=S.buildings.find(b=>b.q===buildingQ&&b.r===buildingR);
  if(!building)return;
  const bt=BT[building.type];
  if(!bt.recruits||!bt.recruits.length)return;

  const overlay=document.getElementById('recruit-overlay');
  const list=document.getElementById('recruit-list');
  list.innerHTML='';

  bt.recruits.forEach(unitType=>{
    const ut=UT[unitType];
    if(!ut||ut.team!=='player')return;
    const status=getRecruitStatus(unitType,buildingQ,buildingR);
    const cost=ut.cost||{};

    const card=document.createElement('div');
    card.style.cssText='background:#1b2838;border:1px solid '+(status.can?'#2ecc71':'#e94560')+';border-radius:4px;padding:8px;margin-bottom:6px;cursor:'+(status.can?'pointer':'not-allowed')+';opacity:'+(status.can?'1':'0.6');

    const nameEl=document.createElement('div');
    nameEl.style.cssText='color:#e0c97f;font-weight:bold;font-size:13px;margin-bottom:4px';
    nameEl.textContent=ut.name;
    card.appendChild(nameEl);

    const statsEl=document.createElement('div');
    statsEl.style.cssText='font-size:10px;color:#8a9bb5;margin-bottom:4px';
    statsEl.textContent=`HP:${ut.hp} ATK:${ut.atk} DEF:${ut.def} MOV:${ut.move} RNG:${ut.range}`;
    card.appendChild(statsEl);

    const costEl=document.createElement('div');
    costEl.style.cssText='font-size:10px;color:#ffd700;margin-bottom:4px';
    costEl.textContent='Стоимость: '+Object.entries(cost).map(([r,a])=>`${a} ${rName(r)}`).join(', ');
    card.appendChild(costEl);

    if(ut.minEpoch>0){
      const epochEl=document.createElement('div');
      epochEl.style.cssText='font-size:9px;color:'+(S.epoch>=ut.minEpoch?'#2ecc71':'#e94560');
      epochEl.textContent=S.epoch>=ut.minEpoch?`Эпоха ${ut.minEpoch} ✓`:`Требуется Эпоха ${ut.minEpoch} (сейчас ${S.epoch})`;
      card.appendChild(epochEl);
    }

    if(!status.can){
      const reasonEl=document.createElement('div');
      reasonEl.style.cssText='font-size:9px;color:#e94560;margin-top:2px';
      reasonEl.textContent='\u26A0 '+status.reason;
      card.appendChild(reasonEl);
    }

    if(status.can){
      card.addEventListener('click',()=>{
        recruitUnit(unitType,buildingQ,buildingR);
        if(building.recruitedThisTurn)hideRecruitMenu();
        else showRecruitMenu(buildingQ,buildingR);
      });
    }

    list.appendChild(card);
  });

  overlay.style.display='flex';
  S.phase='recruiting';
  updatePhaseIndicator();
}

function hideRecruitMenu(){
  document.getElementById('recruit-overlay').style.display='none';
  if(S.phase==='recruiting')S.phase='player';
  updatePhaseIndicator();
}

document.getElementById('btn-close-recruit').addEventListener('click',hideRecruitMenu);
