<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Realms of War — Изометрический прототип</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#eee;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;display:flex;height:100vh}
#game-area{flex:1;position:relative}
canvas{display:block}
#sidebar{width:280px;background:#0d1b2a;border-left:2px solid #1b2838;display:flex;flex-direction:column;overflow-y:auto}
#sidebar h2{text-align:center;padding:10px;background:#1b2838;font-size:15px;letter-spacing:2px;color:#e0c97f}
.section{padding:10px 14px;border-bottom:1px solid #1b2838}
.section h3{color:#e94560;font-size:12px;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
.section p{font-size:11px;line-height:1.5;color:#8a9bb5}
.section .val{color:#53d8fb;font-weight:bold}
#minimap-container{padding:8px;text-align:center;border-bottom:1px solid #1b2838}
#minimap{border:2px solid #1b2838;border-radius:3px;cursor:pointer}
#unit-info .stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
#unit-info .stat-label{color:#667;font-size:10px}
#unit-info .stat-val{color:#53d8fb;font-size:11px;font-weight:bold}
#actions{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
#actions button{padding:7px;border:none;border-radius:3px;cursor:pointer;font-size:12px;font-weight:bold;transition:all .2s}
#btn-end-turn{background:#e94560;color:#fff}
#btn-end-turn:hover{background:#ff6b81}
#btn-attack{background:#f39c12;color:#fff}
#btn-attack:hover{background:#f1c40f;color:#333}
#btn-attack:disabled{background:#333;color:#666;cursor:not-allowed}
#btn-build{background:#2ecc71;color:#fff}
#btn-build:hover{background:#27ae60}
#btn-build:disabled{background:#333;color:#666;cursor:not-allowed}
#log{padding:8px 12px;flex:1;overflow-y:auto}
#log h3{color:#e94560;font-size:12px;margin-bottom:4px}
#log .entry{font-size:10px;padding:2px 0;border-bottom:1px solid #0d1b2a;color:#667}
#log .entry.player{color:#53d8fb}
#log .entry.enemy{color:#e94560}
#log .entry.system{color:#f39c12}
#topbar{position:absolute;top:0;left:0;right:280px;background:rgba(13,27,42,.95);padding:5px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1b2838;z-index:10;gap:10px;flex-wrap:wrap}
#topbar .info{font-size:12px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#topbar .info span{margin-right:4px;white-space:nowrap}
.epoch{color:#e0c97f;font-weight:bold}.turn{color:#53d8fb;font-weight:bold}.gold{color:#ffd700}.food{color:#2ecc71}.wood{color:#8B6914}.stone{color:#9a9a9a}.pp-color{color:#f1c40f}.science-color{color:#00e5ff}
.res-income{font-size:9px;color:#5a7;font-weight:normal;margin-left:1px}
#research-display{color:#00e5ff;font-size:11px;font-style:italic}
#phase-indicator{position:absolute;top:40px;left:50%;transform:translateX(-50%);z-index:11;font-size:13px;font-weight:bold;padding:4px 16px;border-radius:4px;pointer-events:none;display:none}
#phase-indicator.enemy-turn{display:block;background:rgba(233,69,96,0.85);color:#fff;animation:phaseFlash 1s infinite}
#phase-indicator.recruiting-phase{display:block;background:rgba(46,204,113,0.85);color:#fff}
@keyframes phaseFlash{0%,100%{opacity:1}50%{opacity:0.6}}
#gameover-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;align-items:center;justify-content:center;flex-direction:column}
#gameover-overlay.visible{display:flex}
#gameover-title{font-size:36px;letter-spacing:4px;margin-bottom:16px}
#gameover-subtitle{font-size:16px;color:#8a9bb5;margin-bottom:24px}
#gameover-stats{font-size:12px;color:#667;line-height:2}
#btn-restart{margin-top:24px;background:#e0c97f;color:#0a0a1a;border:none;border-radius:4px;padding:10px 24px;cursor:pointer;font-size:14px;font-weight:bold;transition:all .2s}
#btn-restart:hover{background:#f0d990;transform:scale(1.05)}
#turn-toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:12;background:rgba(13,27,42,0.95);color:#e0c97f;font-size:13px;font-weight:bold;padding:8px 20px;border-radius:6px;border:1px solid #e0c97f;pointer-events:none;opacity:0;transition:opacity 0.5s}
#turn-toast.show{opacity:1}
#canvas-dim{position:absolute;inset:0;background:rgba(0,0,0,0.25);z-index:5;pointer-events:none;display:none}
@media(max-width:1100px){#topbar .info span{font-size:10px;margin-right:2px}#topbar{padding:4px 8px}}
#tooltip{position:absolute;background:rgba(13,27,42,.95);color:#c0c8d8;padding:6px 10px;border-radius:3px;font-size:10px;pointer-events:none;display:none;z-index:20;border:1px solid #e0c97f;max-width:220px;line-height:1.4}
#loading{position:fixed;inset:0;background:#0a0a1a;display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:16px}
#loading h1{color:#e0c97f;font-size:24px;letter-spacing:3px}
#loading p{color:#8a9bb5;font-size:14px}
#loading .bar{width:200px;height:4px;background:#1b2838;border-radius:2px;overflow:hidden}
#loading .bar-fill{height:100%;background:#e0c97f;width:0%;transition:width .3s}
</style>
</head>
<body>

<div id="loading">
  <h1>REALMS OF WAR</h1>
  <p>Загрузка спрайтов...</p>
  <div class="bar"><div class="bar-fill" id="load-bar"></div></div>

<div id="game-area">

<script>
// ============================================================
// КОНФИГУРАЦИЯ ГЕКСАГОНАЛЬНОЙ СЕТКИ
// ============================================================
const HEX_SIZE = 30;
const HEX_W = Math.sqrt(3) * HEX_SIZE;
const HEX_H = 2 * HEX_SIZE;

const COLS = 20, ROWS = 15;

const TERRAIN_HEIGHT = { 0:8, 1:14, 2:40, 3:3, 4:5, 5:7, 6:20, 7:16 };
const TERRAIN = { PLAINS:0, FOREST:1, MOUNTAIN:2, WATER:3, DESERT:4, SWAMP:5, HILLS:6, RUINS:7 };
const T_NAMES = { 0:'Равнина',1:'Лес',2:'Гора',3:'Вода',4:'Пустыня',5:'Болото',6:'Холмы',7:'Руины' };
const T_MOVE  = { 0:1,1:2,2:99,3:99,4:1,5:2,6:1,7:1 };
const T_DEF   = { 0:0,1:3,2:99,3:0,4:-1,5:-2,6:2,7:1 };

const T_COLORS = {
  0: { top:'#6aad55', left:'#3d7a30', right:'#4e9040' },
  1: { top:'#1a7520', left:'#0e4a0a', right:'#145c10' },
  2: { top:'#8a8a9a', left:'#505060', right:'#686878' },
  3: { top:'#1868c8', left:'#0a3a78', right:'#104a98' },
  4: { top:'#d8b840', left:'#a88020', right:'#c09830' },
  5: { top:'#4a6838', left:'#283820', right:'#384a2a' },
  6: { top:'#a89060', left:'#706040', right:'#887048' },
  7: { top:'#b050c0', left:'#682888', right:'#8838a0' },
};

// Декорации — рисуем на гексах
const T_DECOR = {
  0: [], // равнина — чистая
  1: [{type:'tree',ox:-8,oy:-4,s:1.0},{type:'tree',ox:6,oy:-2,s:0.8},{type:'tree',ox:0,oy:2,s:0.7}],
  2: [{type:'rock',ox:-4,oy:-6,s:1.2},{type:'rock',ox:5,oy:2,s:0.9}],
  3: [{type:'wave',ox:0,oy:0}],
  4: [{type:'cactus',ox:-3,oy:0},{type:'cactus',ox:6,oy:-2}],
  5: [{type:'mushroom',ox:-5,oy:1},{type:'mushroom',ox:4,oy:-3}],
  6: [{type:'hill',ox:0,oy:0}],
  7: [{type:'ruin',ox:0,oy:0}],
};

// ============================================================
// ЗАГРУЗКА СПРАЙТОВ
// ============================================================
const SPRITE_FILES = {
  hero: 'sprites/hero.png',
  spearman: 'sprites/spearman.png',
  scout: 'sprites/scout.png',
  archer_p: 'sprites/archer_p.png',
  knight: 'sprites/knight.png',
  mage: 'sprites/mage.png',
  goblin: 'sprites/goblin.png',
  archer: 'sprites/archer.png',
  wolf: 'sprites/wolf.png',
  castle: 'sprites/castle.png',
  barracks: 'sprites/barracks.png',
  library: 'sprites/library.png',
};

const sprites = {};
let spritesLoaded = 0;
const totalSprites = Object.keys(SPRITE_FILES).length;

function loadSprites(callback) {
  const bar = document.getElementById('load-bar');
  Object.entries(SPRITE_FILES).forEach(([key, src]) => {
    const img = new Image();
    img.onload = () => {
      sprites[key] = img;
      spritesLoaded++;
      bar.style.width = (spritesLoaded / totalSprites * 100) + '%';
      if (spritesLoaded === totalSprites) {
        document.getElementById('loading').style.display = 'none';
        callback();
      }
    };
    img.onerror = () => {
      sprites[key] = null;
      spritesLoaded++;
      bar.style.width = (spritesLoaded / totalSprites * 100) + '%';
      if (spritesLoaded === totalSprites) {
        document.getElementById('loading').style.display = 'none';
        callback();
      }
    };
    img.src = src;
  });
}

// ============================================================
// АКСИАЛЬНЫЕ КООРДИНАТЫ
// ============================================================
function hexToPixel(q, r) {
  return {
    x: HEX_SIZE * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r),
    y: HEX_SIZE * (3/2 * r)
  };
}
function pixelToHex(px, py) {
  const q = (Math.sqrt(3)/3 * px - 1/3 * py) / HEX_SIZE;
  const r = (2/3 * py) / HEX_SIZE;
  return hexRound(q, r);
}
function hexRound(q, r) {
  let s = -q-r;
  let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  const dq = Math.abs(rq-q), dr = Math.abs(rr-r), ds = Math.abs(rs-s);
  if (dq > dr && dq > ds) rq = -rr-rs;
  else if (dr > ds) rr = -rq-rs;
  return {q:rq, r:rr};
}
function hexDist(q1,r1,q2,r2) {
  return (Math.abs(q1-q2)+Math.abs(q1+r1-q2-r2)+Math.abs(r1-r2))/2;
}
const HEX_DIRS = [{q:1,r:0},{q:1,r:-1},{q:0,r:-1},{q:-1,r:0},{q:-1,r:1},{q:0,r:1}];
function hexNeighbors(q,r) { return HEX_DIRS.map(d=>({q:q+d.q,r:r+d.r})); }
function hexKey(q,r) { return `${q},${r}`; }

// ============================================================
// СОСТОЯНИЕ
// ============================================================
// [PATCH 1] Таймер хода противника — единая точка отмены
let _enemyTurnTimer = null;

const S = {
  map:{}, units:[], buildings:[], selectedUnit:null,
  moveHighlights:new Set(), attackHighlights:new Set(),
  // [TASK 2+3] Unified highlight system
  hoverHex:null, threatHighlights:new Set(), pathHighlights:new Set(), recruitHighlights:new Set(),
  // [PATCH 5] turn=0, startPlayerTurn инкрементит до 1
  turn:0, phase:'player',
  cam:{x:0,y:0}, dragging:false, dragStart:{x:0,y:0}, camStart:{x:0,y:0},
  res:{gold:50,food:30,wood:20,stone:10}, epoch:0, pp:0,
  // [PATCH 4] Карта стоимостей путей для частичного хода
  lastCostMap:{},
  // [TASK 6] Path preview cost map and max-reach boundary set
  pathCostMap:{}, maxReachHighlights:new Set(),
  // [EFFECTS] Visual effects array for spawn/move/hit feedback
  effects:[],
  // [TECH TREE] Research state
  researched: new Set(),
  currentResearch: null,
  researchProgress: 0,
  unlockedUnits: new Set(['hero','spearman']),
  // [TASK 9] Game stats for game-over screen
  stats:{unitsKilled:0}
};

// [PATCH 1+2] Централизованный guard: блокировка ввода вне фазы player
function isInputAllowed(){
  return S.phase === 'player';
}

// ============================================================
// [EFFECTS] ВИЗУАЛЬНЫЕ ЭФФЕКТЫ (спавн/движение/удар)
// ============================================================
function addEffect(effect) {
  S.effects.push(effect);
}

function updateEffects() {
  S.effects = S.effects.filter(e => {
    e.t++;
    return e.t < e.maxT;
  });
}

function renderEffects() {
  S.effects.forEach(e => {
    const pos = hexToPixel(e.q, e.r);
    const sx = pos.x - S.cam.x;
    const sy = pos.y - S.cam.y;
    const progress = e.t / e.maxT;

    if (e.type === 'spawn') {
      // Expanding ring in team color
      const radius = 10 + progress * 30;
      const alpha = 1 - progress;
      ctx.beginPath();
      ctx.arc(sx, sy, radius, 0, Math.PI * 2);
      const teamColor = e.team === 'player' ? `rgba(83,216,251,${alpha})` : `rgba(233,69,96,${alpha})`;
      ctx.strokeStyle = teamColor;
      ctx.lineWidth = 3 * (1 - progress);
      ctx.stroke();
      // Bright flash
      if (progress < 0.25) {
        const flashAlpha = 0.5 * (1 - progress / 0.25);
        ctx.beginPath();
        ctx.arc(sx, sy, 15, 0, Math.PI * 2);
        ctx.fillStyle = e.team === 'player' ? `rgba(83,216,251,${flashAlpha})` : `rgba(233,69,96,${flashAlpha})`;
        ctx.fill();
      }
    } else if (e.type === 'hit') {
      // Floating damage number
      const dy = -progress * 40;
      const alpha = 1 - progress;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(233,69,96,${alpha})`;
      ctx.fillText(`-${e.damage}`, sx, sy - 20 + dy);
      // Flash circle
      if (progress < 0.3) {
        ctx.beginPath();
        ctx.arc(sx, sy - 10, 15, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,100,100,${0.3 * (1 - progress / 0.3)})`;
        ctx.fill();
      }
    } else if (e.type === 'death') {
      // Expanding particles
      const alpha = 1 - progress;
      const rgb = hexToRgb(e.color);
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 / 8) * i + progress * 2;
        const dist = progress * 25;
        const px = sx + Math.cos(angle) * dist;
        const py = sy - 10 + Math.sin(angle) * dist;
        ctx.beginPath();
        ctx.arc(px, py, 3 * (1 - progress), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
        ctx.fill();
      }
    } else if (e.type === 'trail') {
      // Fading trail line
      const fromPos = hexToPixel(e.fromQ, e.fromR);
      const toPos = hexToPixel(e.toQ, e.toR);
      const alpha = 1 - progress;
      ctx.beginPath();
      ctx.moveTo(fromPos.x - S.cam.x, fromPos.y - S.cam.y);
      ctx.lineTo(toPos.x - S.cam.x, toPos.y - S.cam.y);
      ctx.strokeStyle = `rgba(83,216,251,${alpha * 0.5})`;
      ctx.lineWidth = 2 * (1 - progress);
      ctx.stroke();
      // Arrival puff at destination
      if (progress < 0.4) {
        const puffAlpha = 0.3 * (1 - progress / 0.4);
        ctx.beginPath();
        ctx.arc(toPos.x - S.cam.x, toPos.y - S.cam.y, 8 + progress * 10, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(83,216,251,${puffAlpha})`;
        ctx.fill();
      }
    }
  });
}

// ============================================================
// ТИПЫ ЮНИТОВ И ЗДАНИЙ
// ============================================================
const UT = {
  hero:     {name:'Герой',hp:100,atk:15,def:8,move:3,range:1,team:'player',color:'#f1c40f',sprite:'hero',size:24,cost:null,minEpoch:0},
  spearman: {name:'Копейщик',hp:40,atk:8,def:4,move:3,range:1,team:'player',color:'#53d8fb',sprite:'spearman',size:20,cost:{gold:20,food:5},minEpoch:0},
  scout:    {name:'Разведчик',hp:25,atk:5,def:2,move:4,range:1,team:'player',color:'#2ecc71',sprite:'scout',size:18,cost:{gold:15,food:3},minEpoch:0},
  archer_p: {name:'Лучник',hp:28,atk:10,def:2,move:2,range:2,team:'player',color:'#3498db',sprite:'archer_p',size:18,cost:{gold:25,food:5,wood:5},minEpoch:1},
  knight:   {name:'Рыцарь',hp:60,atk:12,def:7,move:2,range:1,team:'player',color:'#9b59b6',sprite:'knight',size:22,cost:{gold:40,food:10,wood:10},minEpoch:2},
  mage:     {name:'Маг',hp:20,atk:14,def:1,move:2,range:3,team:'player',color:'#e74c3c',sprite:'mage',size:18,cost:{gold:50,food:5,wood:15},minEpoch:2},
  goblin:   {name:'Гоблин',hp:30,atk:7,def:3,move:3,range:1,team:'enemy',color:'#e94560',sprite:'goblin',size:20},
  archer:   {name:'Лучник гоб.',hp:22,atk:9,def:1,move:2,range:2,team:'enemy',color:'#c0392b',sprite:'archer',size:18},
  wolf:     {name:'Волк',hp:20,atk:10,def:1,move:5,range:1,team:'enemy',color:'#8e44ad',sprite:'wolf',size:20},
};

const BT = {
  castle:   {name:'Замок',sprite:'castle',size:40,opp:2,cost:{gold:0,wood:0},desc:'+2 ОП/ход, центр',canRecruit:true,recruits:['spearman','scout']},
  barracks: {name:'Казармы',sprite:'barracks',size:28,opp:0,cost:{gold:20,wood:10},desc:'Наём юнитов',canRecruit:true,recruits:['spearman','archer_p','knight']},
  library:  {name:'Библиотека',sprite:'library',size:26,opp:3,cost:{gold:25,wood:15},desc:'+3 ОП/ход, наём мага',canRecruit:true,recruits:['mage']},
};

// ============================================================
// ДЕРЕВО ТЕХНОЛОГИЙ
// ============================================================
const TECHS = {
  gathering:     {id:'gathering',    name:'Собирательство',  epoch:0, cost:0,  requires:[],                  effect:'+1 еда/ход с равнин'},
  hunting:       {id:'hunting',      name:'Охота',           epoch:0, cost:5,  requires:['gathering'],       effect:'Разблокирует Разведчика'},
  agriculture:   {id:'agriculture',  name:'Земледелие',      epoch:0, cost:8,  requires:['gathering'],       effect:'+2 еда/ход'},
  campfires:     {id:'campfires',    name:'Костры',          epoch:0, cost:3,  requires:[],                  effect:'+1 ОП/ход'},
  shamanism:     {id:'shamanism',    name:'Шаманизм',        epoch:0, cost:6,  requires:['campfires'],       effect:'Открывает путь к Магу'},

  writing:       {id:'writing',      name:'Письменность',    epoch:1, cost:12, requires:['agriculture'],     effect:'+1 ОП/ход'},

// ТЕХНОЛОГИИ: УТИЛИТЫ
// ============================================================
function unlockUnit(type){S.unlockedUnits.add(type);}
function isTechResearched(id){return S.researched.has(id);}

function canResearch(id){
  const tech=TECHS[id];
  if(!tech)return false;
  if(tech.epoch>S.epoch)return false;
  if(S.researched.has(id))return false;
  for(const req of tech.requires){
    if(!S.researched.has(req))return false;
  }
  return true;
}

function getTechStatus(id){
  const tech=TECHS[id];
  if(!tech)return {status:'unknown',reason:''};
  if(S.researched.has(id))return {status:'researched',reason:'Изучено'};
  if(S.currentResearch===id)return {status:'researching',reason:`Изучается (${S.researchProgress}/${tech.cost} ОП)`};
  if(tech.epoch>S.epoch)return {status:'epoch-locked',reason:`Нужна Эпоха ${tech.epoch} (сейчас ${S.epoch})`};
  for(const req of tech.requires){
    if(!S.researched.has(req))return {status:'locked',reason:`Требуется: ${TECHS[req]?.name||req}`};
  }
  if(tech.cost>S.pp)return {status:'expensive',reason:`Мало ОП: нужно ${tech.cost}, есть ${S.pp}`};
  return {status:'available',reason:'Доступно для изучения'};
}

function startResearch(id){
  if(!canResearch(id))return false;
  S.currentResearch=id;
  S.researchProgress=0;
  addLog(`Исследование: ${TECHS[id].name}`,'system');
  updateUI();
  return true;
}

function completeResearch(){
  if(!S.currentResearch)return;
  const tech=TECHS[S.currentResearch];
  if(!tech){S.currentResearch=null;return;}
  S.researched.add(tech.id);
  applyTechEffect(tech.id);
  addLog(`Изучено: ${tech.name} — ${tech.effect}`,'system');
  S.currentResearch=null;
  S.researchProgress=0;
  checkEpochTransition();
}

function applyTechEffect(id){
  switch(id){
    case 'hunting': unlockUnit('scout'); break;
    case 'tactics': unlockUnit('archer_p'); break;
    case 'chivalry': unlockUnit('knight'); break;
    case 'shamanism': /* opens path to mage via later techs */ break;
    // Other effects are passive bonuses checked at income time
  }
}

function getSciencePerTurn(){
  let sci=0;
  S.buildings.forEach(b=>{
    if(b.type==='library')sci+=3;
  });
  if(S.researched.has('writing'))sci+=1;
  if(S.researched.has('religion'))sci+=2;
  if(S.researched.has('education'))sci+=2;
  if(S.researched.has('alchemy'))sci+=3;
  return sci;
}

function countTerrain(t){
  let c=0;
  S.units.filter(u=>u.team==='player').forEach(u=>{
    const terrain=S.map[hexKey(u.q,u.r)]?.terrain;
    if(terrain===t)c++;
  });
  return c;
}

function checkEpochTransition(){
  if(S.epoch>=4)return;
  const thresholds=[15,50,120,250];
  const requiredPP=thresholds[S.epoch];
  if(S.pp<requiredPP)return;
  const hasTech=Object.values(TECHS).some(t=>t.epoch===S.epoch&&S.researched.has(t.id));
  if(!hasTech&&S.epoch>0)return;
  S.epoch++;
  addLog(`★ ЭПОХА ${S.epoch}: ${EPOCH_NAMES[S.epoch]}! ★`,'system');
  updateUI();
}

function genMap() {
  S.map={};
  for(let r=0;r<ROWS;r++) for(let q=0;q<COLS;q++){
    const rnd=Math.random();
    let terrain;
    if(rnd<.42)terrain=0;else if(rnd<.56)terrain=1;else if(rnd<.65)terrain=6;
    else if(rnd<.73)terrain=4;else if(rnd<.80)terrain=5;
    else if(rnd<.87)terrain=2;else if(rnd<.93)terrain=3;else terrain=7;
    S.map[hexKey(q,r)]={q,r,terrain};
  }
  const clear=(cq,cr)=>{const c=S.map[hexKey(cq,cr)];if(c)c.terrain=0;
    hexNeighbors(cq,cr).forEach(n=>{const c2=S.map[hexKey(n.q,n.r)];if(c2)c2.terrain=0;})};
  clear(2,2); clear(COLS-3,ROWS-3);
  const setR=(q,r)=>{const c=S.map[hexKey(q,r)];if(c)c.terrain=7;};
  setR(5,1);setR(COLS-6,ROWS-2);setR(Math.floor(COLS/2),Math.floor(ROWS/2));
}

function spawnUnits() {
  S.units=[];
  S.effects=[];
  const _spawnUnit=(type,q,r)=>{
    const u=makeUnit(type,q,r);
    S.units.push(u);
    addEffect({type:'spawn',q,r,t:0,maxT:30,team:u.team});
  };
  _spawnUnit('hero',2,2);
  _spawnUnit('spearman',3,2);
  _spawnUnit('spearman',2,3);
  _spawnUnit('scout',1,3);

  _spawnUnit('goblin',COLS-3,ROWS-3);
  _spawnUnit('goblin',COLS-2,ROWS-3);
  _spawnUnit('archer',COLS-4,ROWS-2);
  _spawnUnit('wolf',COLS-5,ROWS-4);
  _spawnUnit('goblin',Math.floor(COLS/2)+1,Math.floor(ROWS/2));
  _spawnUnit('goblin',Math.floor(COLS/2),Math.floor(ROWS/2)+1);

  // Стартовые здания
  S.buildings=[];
  S.buildings.push(makeBuilding('castle',2,2));
}

function hexVertices(cx,cy,size){
  const v=[];
  for(let i=0;i<6;i++){
    const angle=Math.PI/180*(60*i-30);
    v.push({x:cx+size*Math.cos(angle),y:cy+size*Math.sin(angle)});
  }
  return v;
}

// Рисование декораций на гексах (для тайлинга поверх террейна)
function drawDecor(cx,cy,terrain){
  ctx.save();
  if(terrain===TERRAIN.FOREST){
    // Маленькие деревья с тенями
    const trees = [[-6,-4,5],[4,-3,4],[0,3,3],[-3,2,3],[6,1,4]];
    trees.forEach(([ox,oy,s])=>{
      // Тень дерева
      ctx.beginPath();
      ctx.ellipse(cx+ox+2,cy+oy+s*0.4+2,s*0.9,s*0.35,0,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fill();
      // Ствол
      ctx.fillStyle='#3a2510';
      ctx.fillRect(cx+ox-1,cy+oy+s-4,2,4);
      // Крона — темно-зелёная
      ctx.beginPath();
      ctx.arc(cx+ox,cy+oy,s,0,Math.PI*2);
      ctx.fillStyle='#0e5510';ctx.fill();
      // Светлая подсветка сверху (light direction)
      ctx.beginPath();
      ctx.arc(cx+ox-1,cy+oy-1,s*0.65,0,Math.PI*2);
      ctx.fillStyle='#28a828';ctx.fill();
    });
  } else if(terrain===TERRAIN.MOUNTAIN){
    // Каменные выступы с текстурными линиями
    ctx.fillStyle='#8a8a8a';
    ctx.beginPath();ctx.moveTo(cx-8,cy+4);ctx.lineTo(cx-2,cy-10);ctx.lineTo(cx+4,cy+4);ctx.fill();
    ctx.fillStyle='#9a9a9a';
    ctx.beginPath();ctx.moveTo(cx-2,cy+6);ctx.lineTo(cx+6,cy-6);ctx.lineTo(cx+10,cy+6);ctx.fill();
    // Rocky texture lines
    ctx.strokeStyle='rgba(60,60,80,0.3)';ctx.lineWidth=0.6;
    ctx.beginPath();ctx.moveTo(cx-6,cy+2);ctx.lineTo(cx-1,cy-6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+1,cy+3);ctx.lineTo(cx+7,cy-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-3,cy+0);ctx.lineTo(cx+2,cy+2);ctx.stroke();
    // Снежная шапка с градиентом
    const snowGrad=ctx.createLinearGradient(cx-2,cy-10,cx-2,cy-4);
    snowGrad.addColorStop(0,'rgba(255,255,255,0.95)');
    snowGrad.addColorStop(1,'rgba(220,230,240,0.5)');
    ctx.fillStyle=snowGrad;
    ctx.beginPath();ctx.moveTo(cx-5,cy-5);ctx.lineTo(cx-2,cy-10);ctx.lineTo(cx+1,cy-5);ctx.fill();
    // Вторая шапка
    const snowGrad2=ctx.createLinearGradient(cx+5,cy-6,cx+5,cy-1);
    snowGrad2.addColorStop(0,'rgba(255,255,255,0.85)');
    snowGrad2.addColorStop(1,'rgba(210,220,235,0.4)');
    ctx.fillStyle=snowGrad2;
    ctx.beginPath();ctx.moveTo(cx+3,cy-1);ctx.lineTo(cx+6,cy-6);ctx.lineTo(cx+8,cy-1);ctx.fill();
  } else if(terrain===TERRAIN.WATER){
    // Волны с анимированным мерцанием
    const t=Date.now()*0.002;
    const shimmer=Math.sin(t)*0.15+0.85;
    for(let i=0;i<3;i++){
      const wy=cy-4+i*5;
      const phase=t+i*1.2;
      // Bright highlight wave
      ctx.strokeStyle=`rgba(${Math.round(80*shimmer)},${Math.round(190*shimmer)},${Math.round(250*shimmer)},0.6)`;
      ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(cx-12,wy+Math.sin(phase)*1.5);
      ctx.quadraticCurveTo(cx-5,wy-3+Math.sin(phase+1)*1.5,cx,wy+Math.sin(phase+2)*1.5);
      ctx.quadraticCurveTo(cx+5,wy+3+Math.sin(phase+3)*1.5,cx+12,wy+Math.sin(phase+4)*1.5);
      ctx.stroke();
      // Secondary thinner wave
      ctx.strokeStyle='rgba(40,140,220,0.3)';ctx.lineWidth=0.7;
      ctx.beginPath();
      ctx.moveTo(cx-10,wy+2);
      ctx.quadraticCurveTo(cx-3,wy-1,cx+2,wy+2);
      ctx.quadraticCurveTo(cx+7,wy+5,cx+10,wy+2);
      ctx.stroke();
    }
    // Shimmer sparkles
    for(let i=0;i<4;i++){
      const sx=cx-8+i*5+Math.sin(t+i*2)*2;
      const sy=cy-3+Math.cos(t*1.3+i)*3+i*4;
      const sa=Math.max(0,Math.sin(t*2+i*1.5))*0.5;
      if(sa>0.05){
        ctx.beginPath();ctx.arc(sx,sy,1.2,0,Math.PI*2);
        ctx.fillStyle=`rgba(180,230,255,${sa})`;ctx.fill();
      }
    }
  } else if(terrain===TERRAIN.DESERT){
    // Sand dots with subtle shadow
    for(let i=0;i<5;i++){
      const dx=cx-8+i*4,dy=cy-2+Math.sin(i)*4;
      // Tiny shadow
      ctx.beginPath();ctx.arc(dx+1,dy+1,2.2,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fill();
      // Dot
      ctx.beginPath();ctx.arc(dx,dy,2,0,Math.PI*2);
      ctx.fillStyle='#c8a838';ctx.fill();
    }
    // Subtle dune lines
    ctx.strokeStyle='rgba(160,120,30,0.25)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx-10,cy+5);ctx.quadraticCurveTo(cx,cy+2,cx+10,cy+5);ctx.stroke();
  } else if(terrain===TERRAIN.SWAMP){
    // Murky swamp with bubbles
    [[-5,0],[4,-2],[1,4]].forEach(([ox,oy])=>{
      // Shadow
      ctx.beginPath();ctx.arc(cx+ox+1,cy+oy+1,3.2,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fill();
      // Bush
      ctx.beginPath();ctx.arc(cx+ox,cy+oy,3,0,Math.PI*2);
      ctx.fillStyle='#4a6838';ctx.fill();
      ctx.beginPath();ctx.arc(cx+ox,cy+oy-1,2,0,Math.PI*2);
      ctx.fillStyle='#6a9058';ctx.fill();
    });
    // Murky bubble
    const bt=Date.now()*0.003;
    const bAlpha=Math.max(0,Math.sin(bt))*0.3;
    if(bAlpha>0.05){
      ctx.beginPath();ctx.arc(cx-2,cy+1+Math.sin(bt)*2,1.5,0,Math.PI*2);
      ctx.fillStyle=`rgba(100,160,80,${bAlpha})`;ctx.fill();
    }
  } else if(terrain===TERRAIN.HILLS){
    // Hills with contour lines
    ctx.fillStyle='#9a8a55';
    ctx.beginPath();ctx.ellipse(cx-4,cy+2,8,5,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#8a7a4a';
    ctx.beginPath();ctx.ellipse(cx+5,cy+4,6,4,0,Math.PI,0);ctx.fill();
    // Contour lines on hills
    ctx.strokeStyle='rgba(90,70,30,0.3)';ctx.lineWidth=0.6;
    ctx.beginPath();ctx.ellipse(cx-4,cy+1,6,3.5,0,Math.PI,0);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx-4,cy,4,2,0,Math.PI,0);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx+5,cy+3,4,2.5,0,Math.PI,0);ctx.stroke();
    // Light highlight
    ctx.strokeStyle='rgba(200,180,120,0.2)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.ellipse(cx-4,cy,6,3,0,Math.PI+0.3,Math.PI*1.7);ctx.stroke();
  } else if(terrain===TERRAIN.RUINS){
    // Ruins with mystical glow
    // Glow under ruins
    const glowGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,14);
    glowGrad.addColorStop(0,'rgba(180,80,220,0.2)');
    glowGrad.addColorStop(1,'rgba(180,80,220,0)');
    ctx.fillStyle=glowGrad;
    ctx.fillRect(cx-14,cy-14,28,28);
    // Pillars
    ctx.fillStyle='#7a5090';
    ctx.fillRect(cx-6,cy-4,4,10);ctx.fillRect(cx+2,cy-2,4,8);
    ctx.fillStyle='#604080';
    ctx.fillRect(cx-3,cy+2,6,4);
    // Glowing tips
    ctx.fillStyle='#c080e0';
    ctx.fillRect(cx-2,cy-6,2,4);ctx.fillRect(cx+1,cy-4,2,3);
    // Subtle animated sparkle
    const rt=Date.now()*0.003;
    const rAlpha=Math.max(0,Math.sin(rt))*0.4;
    if(rAlpha>0.05){
      ctx.beginPath();ctx.arc(cx-1,cy-7,2,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,140,255,${rAlpha})`;ctx.fill();
    }
  }
  ctx.restore();
}

// --- 3D Lighting helpers ---
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function rgbStr(r,g,b,a){
  r=Math.max(0,Math.min(255,Math.round(r)));
  g=Math.max(0,Math.min(255,Math.round(g)));
  b=Math.max(0,Math.min(255,Math.round(b)));
  return a!==undefined?`rgba(${r},${g},${b},${a})`:`rgb(${r},${g},${b})`;
}
function applyLight(rgb,intensity){
  return {r:rgb.r*intensity,g:rgb.g*intensity,b:rgb.b*intensity};
}
// Light direction: from top-left (-1,-1,0.5), normalized
const LIGHT_DIR={x:-0.66,y:-0.66,z:0.33};
// Pre-compute wall normals and light dot products
const LIGHT_LEFT_DOT  = Math.max(0, -(LIGHT_DIR.x*0.7+LIGHT_DIR.y*0.7));  // left wall faces roughly (0.7,0.7,0)
const LIGHT_RIGHT_DOT = Math.max(0, -(LIGHT_DIR.x*-0.7+LIGHT_DIR.y*0.7)); // right wall faces roughly (-0.7,0.7,0)
const LIGHT_BACK_DOT  = Math.max(0, -(LIGHT_DIR.x*-1+LIGHT_DIR.y*0));     // back-left wall faces (-1,0,0)
const LIGHT_TOP_DOT   = Math.max(0, LIGHT_DIR.z);                          // top faces up (0,0,1)
const AMBIENT = 0.55;

function wallLitColor(baseHex,dot){
  const base=hexToRgb(baseHex);
  const intensity=AMBIENT+(1-AMBIENT)*dot;
  const lit=applyLight(base,intensity);
  return rgbStr(lit.r,lit.g,lit.b);
}
function wallGradientColors(baseHex,dot){
  const base=hexToRgb(baseHex);
  const topI=AMBIENT+(1-AMBIENT)*dot;
  const botI=topI*0.45;
  const topC=applyLight(base,topI);
  const botC=applyLight(base,botI);
  return {top:rgbStr(topC.r,topC.g,topC.b),bot:rgbStr(botC.r,botC.g,botC.b)};
}

function drawHex3D(cx,cy,terrain,highlight){
  const h=TERRAIN_HEIGHT[terrain];
  const colors=T_COLORS[terrain];
  const verts=hexVertices(cx,cy,HEX_SIZE);

  // ---- Drop shadow for tall hexes ----
  if(h>14){
    const shadowOff=Math.min(h*0.35,16);
    ctx.save();
    ctx.globalAlpha=0.18;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const vx=verts[i].x+shadowOff,vy=verts[i].y+shadowOff;
      if(i===0)ctx.moveTo(vx,vy);else ctx.lineTo(vx,vy);
    }
    ctx.closePath();
    ctx.fillStyle='#000';
    ctx.fill();
    ctx.restore();
  }

  // ---- Back-left wall (verts[2]->verts[3]) ----
  if(h>6){
    const grad=wallGradientColors(colors.left,LIGHT_BACK_DOT);
    const wg=ctx.createLinearGradient(verts[2].x,verts[2].y,verts[3].x,verts[3].y);
    wg.addColorStop(0,grad.top);wg.addColorStop(1,grad.bot);
    ctx.beginPath();
    ctx.moveTo(verts[2].x,verts[2].y);ctx.lineTo(verts[3].x,verts[3].y);
    ctx.lineTo(verts[3].x,verts[3].y+h);ctx.lineTo(verts[2].x,verts[2].y+h);
    ctx.closePath();ctx.fillStyle=wg;ctx.fill();
    // Edge highlight (light-facing edge)
    ctx.beginPath();ctx.moveTo(verts[2].x,verts[2].y);ctx.lineTo(verts[2].x,verts[2].y+h);
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.stroke();
    // Shadow edge
    ctx.beginPath();ctx.moveTo(verts[3].x,verts[3].y);ctx.lineTo(verts[3].x,verts[3].y+h);
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;ctx.stroke();
  }

  // ---- Left wall (verts[3]->verts[4]) with gradient ----
  {
    const grad=wallGradientColors(colors.left,LIGHT_LEFT_DOT);
    const midY=(verts[3].y+verts[4].y)/2;
    const wg=ctx.createLinearGradient((verts[3].x+verts[4].x)/2,midY,(verts[3].x+verts[4].x)/2,midY+h);
    wg.addColorStop(0,grad.top);wg.addColorStop(1,grad.bot);
    ctx.beginPath();
    ctx.moveTo(verts[3].x,verts[3].y);ctx.lineTo(verts[4].x,verts[4].y);
    ctx.lineTo(verts[4].x,verts[4].y+h);ctx.lineTo(verts[3].x,verts[3].y+h);
    ctx.closePath();ctx.fillStyle=wg;ctx.fill();
    // Light-facing edge highlight
    ctx.beginPath();ctx.moveTo(verts[3].x,verts[3].y);ctx.lineTo(verts[3].x,verts[3].y+h);
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();
    // Shadow edge
    ctx.beginPath();ctx.moveTo(verts[4].x,verts[4].y);ctx.lineTo(verts[4].x,verts[4].y+h);
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();
  }

  // ---- Right wall (verts[4]->verts[5]) with gradient ----
  {
    const grad=wallGradientColors(colors.right,LIGHT_RIGHT_DOT);
    const midY=(verts[4].y+verts[5].y)/2;
    const wg=ctx.createLinearGradient((verts[4].x+verts[5].x)/2,midY,(verts[4].x+verts[5].x)/2,midY+h);
    wg.addColorStop(0,grad.top);wg.addColorStop(1,grad.bot);
    ctx.beginPath();
    ctx.moveTo(verts[4].x,verts[4].y);ctx.lineTo(verts[5].x,verts[5].y);
    ctx.lineTo(verts[5].x,verts[5].y+h);ctx.lineTo(verts[4].x,verts[4].y+h);
    ctx.closePath();ctx.fillStyle=wg;ctx.fill();
    // Edge highlights
    ctx.beginPath();ctx.moveTo(verts[4].x,verts[4].y);ctx.lineTo(verts[4].x,verts[4].y+h);
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(verts[5].x,verts[5].y);ctx.lineTo(verts[5].x,verts[5].y+h);
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();
  }

  // ---- Bottom cap ----
  if(h>10){
    ctx.beginPath();
    ctx.moveTo(verts[2].x,verts[2].y+h);ctx.lineTo(verts[3].x,verts[3].y+h);
    ctx.lineTo(verts[4].x,verts[4].y+h);ctx.lineTo(verts[5].x,verts[5].y+h);
    ctx.closePath();
    const baseCol=hexToRgb(colors.left);
    ctx.fillStyle=rgbStr(baseCol.r*0.2,baseCol.g*0.2,baseCol.b*0.2);
    ctx.fill();
  }

  // ---- Top face with directional lighting ----
  ctx.beginPath();
  for(let i=0;i<6;i++){if(i===0)ctx.moveTo(verts[i].x,verts[i].y);else ctx.lineTo(verts[i].x,verts[i].y);}
  ctx.closePath();
  const topLit=wallLitColor(colors.top,LIGHT_TOP_DOT);
  ctx.fillStyle=topLit;ctx.fill();

  // ---- Ambient occlusion: darken edges of top face ----
  ctx.save();ctx.clip();
  // Dark vignette at each vertex
  for(let i=0;i<6;i++){
    const v=verts[i];
    const aGrad=ctx.createRadialGradient(v.x,v.y,0,v.x,v.y,HEX_SIZE*0.5);
    aGrad.addColorStop(0,'rgba(0,0,0,0.15)');
    aGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=aGrad;
    ctx.fillRect(v.x-HEX_SIZE*0.5,v.y-HEX_SIZE*0.5,HEX_SIZE,HEX_SIZE);
  }
  ctx.restore();

  // ---- Contour line around top face ----
  ctx.beginPath();
  for(let i=0;i<6;i++){if(i===0)ctx.moveTo(verts[i].x,verts[i].y);else ctx.lineTo(verts[i].x,verts[i].y);}
  ctx.closePath();
  ctx.strokeStyle='rgba(0,0,0,0.28)';ctx.lineWidth=1.2;ctx.stroke();
  // Light highlight on top edge facing light
  ctx.beginPath();ctx.moveTo(verts[0].x,verts[0].y);ctx.lineTo(verts[1].x,verts[1].y);ctx.lineTo(verts[2].x,verts[2].y);
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.stroke();

  // ---- Height-based fog: low hexes get blue fog, tall hexes get bright vivid overlay ----
  if(h<=5){
    // Low areas: blue-ish fog at base
    ctx.beginPath();
    for(let i=0;i<6;i++){if(i===0)ctx.moveTo(verts[i].x,verts[i].y);else ctx.lineTo(verts[i].x,verts[i].y);}
    ctx.closePath();
    ctx.fillStyle='rgba(40,60,120,0.15)';ctx.fill();
  } else if(h>=30){
    // High areas: slight brightness boost (atmospheric perspective)
    ctx.beginPath();
    for(let i=0;i<6;i++){if(i===0)ctx.moveTo(verts[i].x,verts[i].y);else ctx.lineTo(verts[i].x,verts[i].y);}
    ctx.closePath();
    ctx.fillStyle='rgba(200,220,255,0.08)';ctx.fill();
  }
  // Subtle gradient fog: lower half of top face gets slight desaturation
  {
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<6;i++){if(i===0)ctx.moveTo(verts[i].x,verts[i].y);else ctx.lineTo(verts[i].x,verts[i].y);}
    ctx.closePath();ctx.clip();
    const fogGrad=ctx.createLinearGradient(cx,cy-HEX_SIZE,cx,cy+HEX_SIZE);
    fogGrad.addColorStop(0,'rgba(0,0,0,0)');
    fogGrad.addColorStop(1,'rgba(20,30,60,0.12)');
    ctx.fillStyle=fogGrad;
    ctx.fillRect(cx-HEX_SIZE,cy-HEX_SIZE,HEX_SIZE*2,HEX_SIZE*2);
    ctx.restore();
  }

  // ---- Terrain border emphasis: darker outline for prominent terrain transitions ----
  ctx.beginPath();
  for(let i=0;i<6;i++){if(i===0)ctx.moveTo(verts[i].x,verts[i].y);else ctx.lineTo(verts[i].x,verts[i].y);}
  ctx.closePath();
  if(terrain===TERRAIN.MOUNTAIN||terrain===TERRAIN.WATER){
    ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;ctx.stroke();
  } else if(terrain===TERRAIN.RUINS){
    ctx.strokeStyle='rgba(180,80,220,0.35)';ctx.lineWidth=1.5;ctx.stroke();
  }

  // ---- Decorations on hex ----
  drawDecor(cx,cy-2,terrain);

  // ---- Unified Highlight System (hover/move/attack/selected/threat/recruit/path) ----
  if(highlight&&highlight.size>0){
    const drawHexPath=()=>{ctx.beginPath();for(let i=0;i<6;i++){if(i===0)ctx.moveTo(verts[i].x,verts[i].y);else ctx.lineTo(verts[i].x,verts[i].y);}ctx.closePath();};

    // hover: subtle white outline + slight brightness
    if(highlight.has('hover')){
      drawHexPath();ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.5;ctx.stroke();
    }
    // recruit: green fill + dashed border
    if(highlight.has('recruit')){
      drawHexPath();ctx.fillStyle='rgba(46,204,113,0.2)';ctx.fill();
      ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(46,204,113,0.6)';ctx.lineWidth=2;ctx.stroke();
      ctx.setLineDash([]);
    }
    // path: yellow fill + dots along edges + center dot
    if(highlight.has('path')){
      // Semi-transparent yellow fill for path cells
      drawHexPath();ctx.fillStyle='rgba(255,220,50,0.12)';ctx.fill();
      // Dots along edges
      for(let i=0;i<6;i++){const v1=verts[i],v2=verts[(i+1)%6];
        const mx=(v1.x+v2.x)/2,my=(v1.y+v2.y)/2;
        ctx.beginPath();ctx.arc(mx,my,2.5,0,Math.PI*2);ctx.fillStyle='rgba(255,220,50,0.7)';ctx.fill();}
      // Center dot
      ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fillStyle='rgba(255,220,50,0.8)';ctx.fill();
    }
    // threat: orange pulsing border
    if(highlight.has('threat')){
      const pulse=0.5+0.3*Math.sin(Date.now()*0.004);
      drawHexPath();ctx.strokeStyle=`rgba(230,126,34,${pulse})`;ctx.lineWidth=2.5;ctx.stroke();
    }
    // move: cyan fill + border (keep existing style)
    if(highlight.has('move')){
      drawHexPath();ctx.fillStyle='rgba(83,216,251,0.25)';ctx.fill();
      ctx.strokeStyle='rgba(83,216,251,0.6)';ctx.lineWidth=2;ctx.stroke();
    }
    // [TASK 6] maxReach: cells at max movement range get a subtle marker
    if(highlight.has('maxReach')){
      drawHexPath();ctx.strokeStyle='rgba(83,216,251,0.35)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
      // Small corner marker to indicate max reach
      ctx.beginPath();ctx.arc(verts[0].x,verts[0].y,2.5,0,Math.PI*2);
      ctx.fillStyle='rgba(83,216,251,0.6)';ctx.fill();
    }
    // attack: red fill + border (keep existing style)
    if(highlight.has('attack')){
      drawHexPath();ctx.fillStyle='rgba(233,69,96,0.3)';ctx.fill();
      ctx.strokeStyle='rgba(233,69,96,0.7)';ctx.lineWidth=2;ctx.stroke();
    }
    // selected: gold thick border (always on top)
    if(highlight.has('selected')){
      drawHexPath();ctx.strokeStyle='#f1c40f';ctx.lineWidth=3;ctx.stroke();
    }
    // Stacking glow: if move/attack + hover, add subtle white outline
    if((highlight.has('move')||highlight.has('attack'))&&highlight.has('hover')){
      drawHexPath();ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();
    }
  }
}

function darkenColor(hex,factor){
  const c=hexToRgb(hex);
  return rgbStr(c.r*factor,c.g*factor,c.b*factor);
}
function lightenColor(hex,factor){
  const c=hexToRgb(hex);
  return rgbStr(c.r+(255-c.r)*factor,c.g+(255-c.g)*factor,c.b+(255-c.b)*factor);
}

// ---- Small figure primitives ----
function drawHead(cx,cy,r,skinColor){
  const grad=ctx.createRadialGradient(cx-r*0.3,cy-r*0.35,r*0.1,cx,cy,r);
  const sc=hexToRgb(skinColor);
  grad.addColorStop(0,rgbStr(Math.min(255,sc.r*1.3),Math.min(255,sc.g*1.3),Math.min(255,sc.b*1.3)));
  grad.addColorStop(0.55,rgbStr(sc.r,sc.g,sc.b));
  grad.addColorStop(1,rgbStr(sc.r*0.55,sc.g*0.55,sc.b*0.55));
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle=rgbStr(sc.r*0.35,sc.g*0.35,sc.b*0.35);ctx.lineWidth=0.7;ctx.stroke();
  ctx.beginPath();ctx.arc(cx+r*0.2,cy-r*0.1,r*0.15,0,Math.PI*2);ctx.fillStyle='#2a2a2a';ctx.fill();
  ctx.beginPath();ctx.arc(cx-r*0.25,cy-r*0.25,r*0.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fill();
}
function drawTorso(cx,topY,botY,topW,botW,color){
  const c=hexToRgb(color);
  const grad=ctx.createLinearGradient(cx-botW,topY,cx+botW,botY);
  grad.addColorStop(0,rgbStr(Math.min(255,c.r*1.15),Math.min(255,c.g*1.15),Math.min(255,c.b*1.15)));
  grad.addColorStop(0.4,rgbStr(c.r*0.9,c.g*0.9,c.b*0.9));
  grad.addColorStop(1,rgbStr(c.r*0.5,c.g*0.5,c.b*0.5));
  ctx.beginPath();ctx.moveTo(cx-topW,topY);ctx.lineTo(cx+topW,topY);ctx.lineTo(cx+botW,botY);ctx.lineTo(cx-botW,botY);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle=rgbStr(c.r*0.3,c.g*0.3,c.b*0.3);ctx.lineWidth=0.7;ctx.stroke();
}
function drawLegs(cx,hipY,footY,legSpread,color,walkPhase){
  const c=hexToRgb(color);const legColor=rgbStr(c.r*0.65,c.g*0.65,c.b*0.65);const bootColor=rgbStr(c.r*0.35,c.g*0.35,c.b*0.35);
  const swing=Math.sin(walkPhase)*3;
  [-1,1].forEach((dir,i)=>{const sw=(i===0?1:-1)*swing;const lx=cx+dir*legSpread;
    ctx.beginPath();ctx.moveTo(lx,hipY);ctx.lineTo(lx+sw,footY-3);ctx.strokeStyle=legColor;ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();ctx.ellipse(lx+sw,footY,3.5,2,0,0,Math.PI*2);ctx.fillStyle=bootColor;ctx.fill();});
}
function drawArm(cx,shoulderY,elbowY,handX,handY,color,side){
  const c=hexToRgb(color);ctx.beginPath();ctx.moveTo(cx+side*4,shoulderY);ctx.quadraticCurveTo(cx+side*8,elbowY,handX,handY);
  ctx.strokeStyle=rgbStr(c.r*0.75,c.g*0.75,c.b*0.75);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();
}
function drawSmallShield(cx,cy,r,color){
  const c=hexToRgb(color);const grad=ctx.createRadialGradient(cx-r*0.2,cy-r*0.2,r*0.1,cx,cy,r);
  grad.addColorStop(0,rgbStr(Math.min(255,c.r*1.4),Math.min(255,c.g*1.4),Math.min(255,c.b*1.4)));
  grad.addColorStop(0.5,rgbStr(c.r*0.85,c.g*0.85,c.b*0.85));grad.addColorStop(1,rgbStr(c.r*0.4,c.g*0.4,c.b*0.4));
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle=rgbStr(c.r*0.25,c.g*0.25,c.b*0.25);ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r*0.25,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
}
function drawHeldSword(handX,handY,angle,len){
  ctx.save();ctx.translate(handX,handY);ctx.rotate(angle);
  const bladeGrad=ctx.createLinearGradient(-1.5,-len,1.5,0);
  bladeGrad.addColorStop(0,'rgba(255,255,255,0.9)');bladeGrad.addColorStop(0.5,'rgba(200,210,220,1)');bladeGrad.addColorStop(1,'rgba(140,150,165,0.8)');
  ctx.strokeStyle=bladeGrad;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-len);ctx.lineTo(0,0);ctx.stroke();
  ctx.strokeStyle='#8B6914';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(4,0);ctx.stroke();
  ctx.restore();
}
function drawHeldSpear(handX,handY,shaftLen){
  const shaftGrad=ctx.createLinearGradient(handX-1.5,handY-shaftLen,handX+1.5,handY);
  shaftGrad.addColorStop(0,'#a07030');shaftGrad.addColorStop(0.5,'#8B5A20');shaftGrad.addColorStop(1,'#5a3818');
  ctx.strokeStyle=shaftGrad;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(handX,handY);ctx.lineTo(handX,handY-shaftLen);ctx.stroke();
  const tipGrad=ctx.createLinearGradient(handX-3,handY-shaftLen-6,handX+3,handY-shaftLen);
  tipGrad.addColorStop(0,'rgba(255,255,255,0.95)');tipGrad.addColorStop(1,'rgba(140,150,165,0.8)');
  ctx.fillStyle=tipGrad;ctx.beginPath();ctx.moveTo(handX,handY-shaftLen-6);ctx.lineTo(handX-3,handY-shaftLen+1);ctx.lineTo(handX+3,handY-shaftLen+1);ctx.closePath();ctx.fill();
}
function drawHeldBow(handX,handY,angle,bowR){
  ctx.save();ctx.translate(handX,handY);ctx.rotate(angle);
  const woodGrad=ctx.createLinearGradient(-2,0,2,0);woodGrad.addColorStop(0,'#5a3010');woodGrad.addColorStop(0.4,'#a07030');woodGrad.addColorStop(1,'#6a4018');
  ctx.strokeStyle=woodGrad;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,bowR,Math.PI*0.3,Math.PI*1.7);ctx.stroke();
  const a1=Math.PI*0.3,a2=Math.PI*1.7;ctx.strokeStyle='rgba(220,215,200,0.8)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(bowR*Math.cos(a1),bowR*Math.sin(a1));ctx.lineTo(bowR*Math.cos(a2),bowR*Math.sin(a2));ctx.stroke();ctx.restore();
}
function drawHeldStaff(handX,handY,shaftLen){
  ctx.strokeStyle='#5a3820';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(handX,handY);ctx.lineTo(handX,handY-shaftLen);ctx.stroke();
  const orbY=handY-shaftLen-3;const orbGlow=ctx.createRadialGradient(handX,orbY,0,handX,orbY,8);
  orbGlow.addColorStop(0,'rgba(120,200,255,0.5)');orbGlow.addColorStop(0.5,'rgba(80,160,255,0.15)');orbGlow.addColorStop(1,'rgba(60,120,255,0)');
  ctx.fillStyle=orbGlow;ctx.beginPath();ctx.arc(handX,orbY,8,0,Math.PI*2);ctx.fill();
  const orbGrad=ctx.createRadialGradient(handX-1,orbY-1,1,handX,orbY,4);orbGrad.addColorStop(0,'#d0f0ff');orbGrad.addColorStop(0.5,'#60b0ff');orbGrad.addColorStop(1,'#2060a0');
  ctx.beginPath();ctx.arc(handX,orbY,4,0,Math.PI*2);ctx.fillStyle=orbGrad;ctx.fill();
}

// ============================================================
// CIVILIZATION-STYLE UNIT RENDERER per type
// ============================================================
function drawUnit3D(type,cx,groundY,size,color,team,facing,walkPhase,idleBob){
  const s=size;const f=facing;const bob=idleBob;const isWalking=walkPhase>0;const wp=isWalking?walkPhase*0.8:0;const by=groundY-bob;
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.ellipse(cx,groundY+2,s*0.5,s*0.15,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();

  if(type==='hero'){
    const h=s*1.8;const headY=by-h+s*0.15;const shoulderY=by-h*0.7;const hipY=by-h*0.35;const footY=by;
    ctx.beginPath();ctx.moveTo(cx-f*3,shoulderY);ctx.quadraticCurveTo(cx-f*8,hipY,cx-f*5,footY);ctx.lineTo(cx+f*2,footY);ctx.quadraticCurveTo(cx+f*2,hipY,cx+f*2,shoulderY);ctx.closePath();
    const capeGrad=ctx.createLinearGradient(cx,shoulderY,cx,footY);capeGrad.addColorStop(0,lightenColor(color,0.1));capeGrad.addColorStop(1,darkenColor(color,0.5));ctx.fillStyle=capeGrad;ctx.fill();
    drawLegs(cx,hipY,footY,3,darkenColor(color,0.5),wp);drawTorso(cx,shoulderY,hipY,s*0.28,s*0.2,color);
    ctx.fillStyle='#8B6914';ctx.fillRect(cx-s*0.22,hipY-2,s*0.44,3);ctx.beginPath();ctx.arc(cx,hipY-1,2,0,Math.PI*2);ctx.fillStyle='#f0d060';ctx.fill();
    drawArm(cx,shoulderY+2,shoulderY+s*0.2,cx-f*s*0.35,shoulderY+s*0.35,color,-f);
    drawArm(cx,shoulderY+2,shoulderY+s*0.15,cx+f*s*0.3,shoulderY+s*0.1,color,f);
    drawHeldSword(cx+f*s*0.3,shoulderY+s*0.1,-0.3-f*0.3,s*0.7);
    [-1,1].forEach(dir=>{ctx.beginPath();ctx.ellipse(cx+dir*s*0.28,shoulderY+1,s*0.1,s*0.06,dir*0.2,0,Math.PI*2);ctx.fillStyle=lightenColor(color,0.15);ctx.fill();});
    drawHead(cx,headY,s*0.15,'#f0d0a0');
    const crY=headY-s*0.15;ctx.beginPath();ctx.moveTo(cx-s*0.15,crY);ctx.lineTo(cx-s*0.1,crY-s*0.12);ctx.lineTo(cx,crY-s*0.06);ctx.lineTo(cx+s*0.1,crY-s*0.12);ctx.lineTo(cx+s*0.15,crY);ctx.closePath();
    ctx.fillStyle='#f0c030';ctx.fill();ctx.beginPath();ctx.arc(cx,crY-s*0.06,1.2,0,Math.PI*2);ctx.fillStyle='#e74c3c';ctx.fill();
  }else if(type==='spearman'){
    const h=s*1.6;const headY=by-h+s*0.12;const shoulderY=by-h*0.68;const hipY=by-h*0.32;const footY=by;
    drawLegs(cx,hipY,footY,3,darkenColor(color,0.5),wp);drawTorso(cx,shoulderY,hipY,s*0.22,s*0.18,color);
    drawArm(cx,shoulderY+2,shoulderY+s*0.18,cx-f*s*0.3,shoulderY+s*0.3,color,-f);drawSmallShield(cx-f*s*0.3,shoulderY+s*0.25,s*0.15,color);
    drawArm(cx,shoulderY+2,shoulderY+s*0.1,cx+f*s*0.2,shoulderY-s*0.05,color,f);drawHeldSpear(cx+f*s*0.2,shoulderY-s*0.05,h*0.85);
    drawHead(cx,headY,s*0.13,'#f0d0a0');
    ctx.beginPath();ctx.arc(cx,headY-s*0.02,s*0.15,Math.PI,0);const helmGrad=ctx.createLinearGradient(cx-s*0.15,headY-s*0.15,cx+s*0.1,headY);helmGrad.addColorStop(0,'#b0b8c0');helmGrad.addColorStop(1,'#606870');ctx.fillStyle=helmGrad;ctx.fill();ctx.strokeStyle='#404850';ctx.lineWidth=0.6;ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,headY-s*0.17);ctx.lineTo(cx,headY+s*0.02);ctx.strokeStyle='#707880';ctx.lineWidth=1.2;ctx.stroke();
  }else if(type==='scout'){
    const h=s*1.5;const headY=by-h+s*0.1;const shoulderY=by-h*0.65;const hipY=by-h*0.3;const footY=by;
    drawLegs(cx,hipY,footY,2.5,darkenColor(color,0.5),wp);
    ctx.beginPath();ctx.moveTo(cx-f*2,shoulderY);ctx.quadraticCurveTo(cx-f*6,hipY,cx-f*4,footY);ctx.strokeStyle=darkenColor(color,0.55);ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+f*2,shoulderY);ctx.quadraticCurveTo(cx+f*5,hipY,cx+f*3,footY);ctx.stroke();
    drawTorso(cx,shoulderY,hipY,s*0.16,s*0.12,color);
    ctx.strokeStyle='#c0c8d0';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(cx+f*3,hipY-3);ctx.lineTo(cx+f*4,hipY+5);ctx.stroke();
    drawArm(cx,shoulderY+2,shoulderY+s*0.15,cx-f*3,shoulderY+s*0.2,color,-f);drawArm(cx,shoulderY+2,shoulderY+s*0.15,cx+f*3,shoulderY+s*0.2,color,f);

function drawSpriteUnit(u,cx,cy){
  const terrain=S.map[hexKey(u.q,u.r)]?.terrain||0;
  const isSelected=S.selectedUnit&&S.selectedUnit===u;
  const groundY=cy;
  if(u.walkAnim>0)u.walkAnim--;
  const idleBob=Math.sin(Date.now()*0.003+u.animT)*1.5;
  const walkBounce=u.walkAnim>0?Math.abs(Math.sin(u.walkAnim*0.5))*2:0;
  ctx.beginPath();ctx.ellipse(cx,groundY+3,u.size*0.45,u.size*0.12,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
  if(isSelected){
    ctx.save();ctx.beginPath();ctx.ellipse(cx,groundY+2,u.size*0.6,u.size*0.18,0,0,Math.PI*2);ctx.strokeStyle=`rgba(241,196,15,${0.6+0.2*Math.sin(Date.now()*0.004)})`;ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    const pulse=0.3+0.2*Math.sin(Date.now()*0.005);const glowGrad=ctx.createRadialGradient(cx,groundY-u.size*0.7,u.size*0.2,cx,groundY-u.size*0.7,u.size*1.2);glowGrad.addColorStop(0,`rgba(241,196,15,${pulse*0.25})`);glowGrad.addColorStop(1,'rgba(241,196,15,0)');ctx.fillStyle=glowGrad;ctx.beginPath();ctx.arc(cx,groundY-u.size*0.7,u.size*1.2,0,Math.PI*2);ctx.fill();
  }
  ctx.beginPath();ctx.ellipse(cx,groundY+1,u.size*0.35,u.size*0.1,0,0,Math.PI*2);ctx.fillStyle=u.team==='player'?'rgba(83,216,251,0.2)':'rgba(233,69,96,0.2)';ctx.fill();
  drawUnit3D(u.type,cx,groundY,u.size,u.color,u.team,u.facing,u.walkAnim,idleBob+walkBounce);
  const bw=u.size*2,bh=3.5;const bx=cx-bw/2;const topY=groundY-u.size*1.8-walkBounce;const by=topY-5;const ratio=u.hp/u.maxHp;
  ctx.strokeStyle='#000';ctx.lineWidth=0.8;ctx.strokeRect(bx-0.5,by-0.5,bw+1,bh+1);ctx.fillStyle='#1a1a1a';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=ratio>.5?'#2ecc71':ratio>.25?'#f39c12':'#e94560';ctx.fillRect(bx,by,Math.max(0,bw*ratio),bh);
  if(bw>24){ctx.font='bold 5px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(`${u.hp}/${u.maxHp}`,cx,by+bh/2);}
  if(u.level>1){ctx.fillStyle='#f1c40f';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('\u2605',cx+bw/2+6,by+1);}
  const statusY=groundY+8;
  if(u.attacked){ctx.save();ctx.globalAlpha=0.5;ctx.strokeStyle='#888';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(cx-3,statusY-4);ctx.lineTo(cx+1,statusY);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-2,statusY);ctx.lineTo(cx+1,statusY);ctx.lineTo(cx+4,statusY+3);ctx.stroke();ctx.restore();}
  if(u.move>0&&!u.attacked){const dots=Math.min(u.move,5);for(let i=0;i<dots;i++){ctx.beginPath();ctx.arc(cx-u.size+4+i*4,statusY,1.5,0,Math.PI*2);ctx.fillStyle=u.team==='player'?'#53d8fb':'#e94560';ctx.fill();}}
  const defBonus=T_DEF[terrain]||0;if(defBonus>0){ctx.save();ctx.globalAlpha=0.6;ctx.strokeStyle='#4a90d9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx+u.size+3,statusY-3);ctx.lineTo(cx+u.size,statusY-1);ctx.lineTo(cx+u.size,statusY+1);ctx.quadraticCurveTo(cx+u.size+3,statusY+3,cx+u.size+6,statusY+1);ctx.lineTo(cx+u.size+6,statusY-1);ctx.closePath();ctx.stroke();ctx.restore();}
  if(u.move<=0&&u.attacked&&u.team==='player'){ctx.beginPath();ctx.ellipse(cx,groundY-u.size*0.6,u.size*0.5,u.size*0.7,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fill();}
}

function drawSpriteBuilding(b,cx,cy){
  const terrain=S.map[hexKey(b.q,b.r)]?.terrain||0;
  const h=TERRAIN_HEIGHT[terrain];
  const spriteImg=sprites[b.sprite];
  const drawSize=b.size;

  if(spriteImg){
    // Здание рисуется чуть ниже верха гекса
    ctx.save();
    // Тень
    ctx.beginPath();ctx.ellipse(cx,cy+6,drawSize*0.6,drawSize*0.3,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();

    // Спрайт здания
    const bx=cx-drawSize,by=cy-h-drawSize*1.2;
    ctx.drawImage(spriteImg,bx,by,drawSize*2,drawSize*2);

    // Подпись
    ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillStyle='#e0c97f';
    ctx.fillText(b.name,cx,cy-drawSize*0.6);
    ctx.restore();
  }
}

function render(){
  updateEffects();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(-S.cam.x,-S.cam.y);

  const cells=Object.values(S.map);
  cells.sort((a,b)=>a.r-b.r||a.q-b.q);

  // Собираем объекты для сортировки по Y (painter's algorithm)
  const drawables=[];
  cells.forEach(cell=>{
    const pos=hexToPixel(cell.q,cell.r);
    const sx=pos.x-S.cam.x,sy=pos.y-S.cam.y;
    if(sx>-150&&sx<canvas.width+150&&sy>-200&&sy<canvas.height+150){
      const key=hexKey(cell.q,cell.r);
      // [TASK 2+3] Unified highlight: compute full Set with all active types
      const hl=new Set();
      if(S.hoverHex&&S.hoverHex.q===cell.q&&S.hoverHex.r===cell.r)hl.add('hover');
      if(S.recruitHighlights.has(key))hl.add('recruit');
      if(S.pathHighlights.has(key))hl.add('path');
      if(S.threatHighlights.has(key))hl.add('threat');
      if(S.moveHighlights.has(key))hl.add('move');
      if(S.maxReachHighlights.has(key))hl.add('maxReach');
      if(S.attackHighlights.has(key))hl.add('attack');
      if(S.selectedUnit&&S.selectedUnit.q===cell.q&&S.selectedUnit.r===cell.r)hl.add('selected');
      drawables.push({type:'hex',pos,cell,hl:hl.size?hl:null,y:pos.y+TERRAIN_HEIGHT[cell.terrain]});
    }
  });

  // Здания
  S.buildings.forEach(b=>{
    const pos=hexToPixel(b.q,b.r);
    const sx=pos.x-S.cam.x,sy=pos.y-S.cam.y;
    if(sx>-150&&sx<canvas.width+150&&sy>-200&&sy<canvas.height+150){
      const t=S.map[hexKey(b.q,b.r)]?.terrain||0;
      drawables.push({type:'building',obj:b,pos,y:pos.y+TERRAIN_HEIGHT[t]-20});
    }
  });

  // Юниты
  S.units.forEach(u=>{
    const pos=hexToPixel(u.q,u.r);
    const sx=pos.x-S.cam.x,sy=pos.y-S.cam.y;
    if(sx>-150&&sx<canvas.width+150&&sy>-200&&sy<canvas.height+150){
      const t=S.map[hexKey(u.q,u.r)]?.terrain||0;
      drawables.push({type:'unit',obj:u,pos,y:pos.y+TERRAIN_HEIGHT[t]});
    }
  });

  // Сортируем по Y для правильного порядка отрисовки
  drawables.sort((a,b)=>a.y-b.y);

  // Рисуем всё
  drawables.forEach(d=>{
    if(d.type==='hex'){
      drawHex3D(d.pos.x,d.pos.y,d.cell.terrain,d.hl);
      // [TASK 6] Draw path cost numbers on path-highlighted cells
      if(d.hl&&d.hl.has('path')){
        const key=hexKey(d.cell.q,d.cell.r);
        const cost=S.pathCostMap[key];
        if(cost!==undefined){
          ctx.save();
          const h=TERRAIN_HEIGHT[d.cell.terrain];
          // Small cost badge: dark circle with number
          const bx=d.pos.x+10,by=d.pos.y-h*0.1-10;
          ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);
          ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fill();
          ctx.strokeStyle='rgba(255,220,50,0.8)';ctx.lineWidth=1;ctx.stroke();
          ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#ffdc32';ctx.fillText(String(cost),bx,by);
          ctx.restore();
        }
      }
    }
    else if(d.type==='building') drawSpriteBuilding(d.obj,d.pos.x,d.pos.y);
    else if(d.type==='unit') drawSpriteUnit(d.obj,d.pos.x,d.pos.y);
  });

  // [EFFECTS] Render visual effects on top of everything
  renderEffects();

  ctx.restore();
  renderMinimap();
}

function renderMinimap(){
  const mw=mmCanvas.width,mh=mmCanvas.height;
  const legendH=18; // reserved for legend at bottom
  const mapH=mh-legendH;
  const sx=mw/(COLS*HEX_W),sy=mapH/(ROWS*HEX_H*0.75);
  const sc=Math.min(sx,sy);
  const offsetX=mw/2-COLS*HEX_W*sc/2;
  const offsetY=8;

  // Helper: world coords to minimap coords
  function mmPos(q,r){
    const pos=hexToPixel(q,r);
    return {x:pos.x*sc+offsetX, y:pos.y*sc+offsetY};
  }

  mmCtx.clearRect(0,0,mw,mh);
  mmCtx.fillStyle='#0a0a1a';mmCtx.fillRect(0,0,mw,mh);

  // --- Enhanced terrain colors for minimap (more saturated) ---
  const MM_TERRAIN_COLORS={
    0:'#7cc462', // plains - brighter green
    1:'#1fa828', // forest - vivid green
    2:'#9a9ab0', // mountain - lighter grey
    3:'#2888e8', // water - bright blue
    4:'#e8c840', // desert - vivid yellow
    5:'#5a8848', // swamp - olive green
    6:'#c0a068', // hills - tan
    7:'#c858d8', // ruins - vivid purple
  };

  // --- Draw terrain as small hexagons ---
  const hexR=Math.max(2.5, sc*HEX_SIZE*0.48); // small hex radius on minimap
  function drawMiniHex(cx,cy,r,fillColor,borderColor){
    mmCtx.beginPath();
    for(let i=0;i<6;i++){
      const angle=Math.PI/180*(60*i-30);
      const vx=cx+r*Math.cos(angle);
      const vy=cy+r*Math.sin(angle);
      if(i===0)mmCtx.moveTo(vx,vy);else mmCtx.lineTo(vx,vy);
    }
    mmCtx.closePath();
    mmCtx.fillStyle=fillColor;mmCtx.fill();
    if(borderColor){
      mmCtx.strokeStyle=borderColor;mmCtx.lineWidth=0.5;mmCtx.stroke();
    }
  }

  // Compute visibility: hexes near player units are visible
  const playerUnits=S.units.filter(u=>u.team==='player');
  const visCache={};
  function isVisible(q,r){
    const k=q+','+r;
    if(k in visCache)return visCache[k];
    let minD=999;
    for(let i=0;i<playerUnits.length;i++){
      const d=hexDist(q,r,playerUnits[i].q,playerUnits[i].r);
      if(d<minD)minD=d;
    }
    visCache[k]=minD<=6;
    return visCache[k];
  }

  // Draw terrain hexes
  Object.values(S.map).forEach(cell=>{
    const {x,y}=mmPos(cell.q,cell.r);
    const col=MM_TERRAIN_COLORS[cell.terrain]||'#555';
    drawMiniHex(x,y,hexR,col,'#0a0a1a');

    // Fog of war overlay for unexplored areas
    if(playerUnits.length>0 && !isVisible(cell.q,cell.r)){
      mmCtx.beginPath();
      for(let i=0;i<6;i++){
        const angle=Math.PI/180*(60*i-30);
        const vx=x+hexR*Math.cos(angle);
        const vy=y+hexR*Math.sin(angle);
        if(i===0)mmCtx.moveTo(vx,vy);else mmCtx.lineTo(vx,vy);
      }
      mmCtx.closePath();
      mmCtx.fillStyle='rgba(10,10,26,0.55)';mmCtx.fill();
    }
  });

  // --- Draw buildings ---
  S.buildings.forEach(b=>{
    const {x,y}=mmPos(b.q,b.r);
    const isCastle=b.type==='castle';
    const sz=isCastle?5:3.5;

    if(isCastle){
      // Castle: star shape
      mmCtx.beginPath();
      for(let i=0;i<5;i++){
        const outerAngle=Math.PI/180*(72*i-90);
        const innerAngle=Math.PI/180*(72*i+36-90);
        mmCtx.lineTo(x+sz*Math.cos(outerAngle),y+sz*Math.sin(outerAngle));
        mmCtx.lineTo(x+sz*0.45*Math.cos(innerAngle),y+sz*0.45*Math.sin(innerAngle));
      }
      mmCtx.closePath();
      mmCtx.fillStyle='#ffd700';mmCtx.fill();
      mmCtx.strokeStyle='#fff';mmCtx.lineWidth=0.8;mmCtx.stroke();
    }else{
      // Other buildings: diamond
      mmCtx.beginPath();
      mmCtx.moveTo(x,y-sz);mmCtx.lineTo(x+sz,y);
      mmCtx.lineTo(x,y+sz);mmCtx.lineTo(x-sz,y);
      mmCtx.closePath();
      mmCtx.fillStyle='#e0c97f';mmCtx.fill();
      mmCtx.strokeStyle='rgba(255,255,255,0.5)';mmCtx.lineWidth=0.6;mmCtx.stroke();
    }
  });

  // --- Draw units ---
  const now=performance.now();
  S.units.forEach(u=>{
    const {x,y}=mmPos(u.q,u.r);
    const isPlayer=u.team==='player';
    const isSelected=S.selectedUnit&&S.selectedUnit===u;
    const dotR=isSelected?4.5:3;

    // Pulse effect for selected unit
    if(isSelected){
      const pulse=0.6+0.4*Math.sin(now/200);
      mmCtx.beginPath();
      mmCtx.arc(x,y,dotR+3,0,Math.PI*2);
      mmCtx.fillStyle=`rgba(255,255,255,${(pulse*0.35).toFixed(2)})`;
      mmCtx.fill();
    }

    // Unit dot
    mmCtx.beginPath();
    mmCtx.arc(x,y,dotR,0,Math.PI*2);
    mmCtx.fillStyle=u.color;mmCtx.fill();

    // Outline: white for player, dark for enemy
    mmCtx.strokeStyle=isPlayer?'rgba(255,255,255,0.8)':'rgba(40,0,0,0.8)';
    mmCtx.lineWidth=isPlayer?1.2:1;
    mmCtx.stroke();
  });

  // --- Camera viewport rectangle ---
  const viewLeft=S.cam.x;
  const viewTop=S.cam.y;
  const viewRight=S.cam.x+canvas.width;
  const viewBottom=S.cam.y+canvas.height;

  const vx1=viewLeft*sc+offsetX;
  const vy1=viewTop*sc+offsetY;
  const vx2=viewRight*sc+offsetX;
  const vy2=viewBottom*sc+offsetY;

  mmCtx.strokeStyle='rgba(255,255,255,0.6)';
  mmCtx.lineWidth=1.5;
  mmCtx.setLineDash([3,2]);
  mmCtx.strokeRect(vx1,vy1,vx2-vx1,vy2-vy1);
  mmCtx.setLineDash([]);

  // --- Legend ---
  const legendY=mh-legendH+4;
  mmCtx.fillStyle='#0a0a1a';mmCtx.fillRect(0,mh-legendH,mw,legendH);
  const legendItems=[
    {color:MM_TERRAIN_COLORS[3],label:'Water'},
    {color:MM_TERRAIN_COLORS[1],label:'Forest'},
    {color:MM_TERRAIN_COLORS[2],label:'Mtn'},
    {color:MM_TERRAIN_COLORS[0],label:'Plains'},
    {color:'#ffd700',label:'Castle'},
    {color:'#53d8fb',label:'You'},
    {color:'#e94560',label:'Enemy'},
  ];
  const itemW=mw/legendItems.length;
  mmCtx.font='8px sans-serif';
  mmCtx.textAlign='center';
  legendItems.forEach((it,i)=>{
    const cx=i*itemW+itemW/2;
    mmCtx.fillStyle=it.color;
    mmCtx.fillRect(cx-12,legendY,6,6);
    mmCtx.fillStyle='#8a9bb5';
    mmCtx.fillText(it.label,cx+2,legendY+5.5);
  });
}

// --- Minimap click-to-focus and drag support ---
(function(){
  let mmDragging=false;
  function minimapToWorld(e){
    const rect=mmCanvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;
    const mw=mmCanvas.width,mh=mmCanvas.height;
    const legendH=18;
    const mapH=mh-legendH;
    const sx=mw/(COLS*HEX_W),sy=mapH/(ROWS*HEX_H*0.75);
    const sc=Math.min(sx,sy);
    const offsetX=mw/2-COLS*HEX_W*sc/2;
    const offsetY=8;
    const worldX=(mx-offsetX)/sc;
    const worldY=(my-offsetY)/sc;
    return {x:worldX,y:worldY};
  }
  function centerOnMinimapClick(e){
    const w=minimapToWorld(e);
    S.cam.x=w.x-canvas.width/2;
    S.cam.y=w.y-canvas.height/2;
    clampCam();
  }
  mmCanvas.addEventListener('mousedown',e=>{
    mmDragging=true;
    centerOnMinimapClick(e);
    e.preventDefault();
  });
  mmCanvas.addEventListener('mousemove',e=>{
    if(mmDragging)centerOnMinimapClick(e);
  });
  window.addEventListener('mouseup',()=>{mmDragging=false;});
  mmCanvas.addEventListener('click',e=>{
    centerOnMinimapClick(e);
  });
})();

// [PATCH 4] findReachable: использует unit.move (остаток), возвращает costMap
function findReachable(unit){
  const moveCells=new Set(),attackCells=new Set();
  const visited={};
  const costMap={};
  const queue=[{q:unit.q,r:unit.r,cost:0}];
  visited[hexKey(unit.q,unit.r)]=0;
  costMap[hexKey(unit.q,unit.r)]=0;
  while(queue.length){
    const cur=queue.shift();
    for(const n of hexNeighbors(cur.q,cur.r)){
      const cell=S.map[hexKey(n.q,n.r)];if(!cell)continue;
      const mc=T_MOVE[cell.terrain];if(mc>=99)continue;
      const totalCost=cur.cost+mc;
      const k=hexKey(n.q,n.r);
      if(visited[k]!==undefined&&visited[k]<=totalCost)continue;
      if(totalCost>unit.move)continue;  // [PATCH 4] unit.move вместо unit.maxMove
      const occ=S.units.find(u=>u.q===n.q&&u.r===n.r);
      visited[k]=totalCost;
      costMap[k]=totalCost;
      if(occ&&occ.team!==unit.team){attackCells.add(k);}
      else if(occ&&occ.team===unit.team){continue;}
      else{moveCells.add(k);queue.push({q:n.q,r:n.r,cost:totalCost});}
    }
  }
  if(unit.range>1){
    S.units.filter(u=>u.team!==unit.team).forEach(e=>{
      if(hexDist(unit.q,unit.r,e.q,e.r)<=unit.range)attackCells.add(hexKey(e.q,e.r));
    });
  }
  return{moveCells,attackCells,costMap};
}

function findAttackTargets(unit){
  return S.units.filter(u=>u.team!==unit.team&&hexDist(unit.q,unit.r,u.q,u.r)<=unit.range);
}

// [TASK 6] findPath: BFS pathfinding from (fromQ,fromR) to (toQ,toR) for a given unit
function findPath(fromQ,fromR,toQ,toR,unit){
  const visited={};
  const parent={};
  const costMap={};
  const queue=[{q:fromQ,r:fromR,cost:0}];
  const startKey=hexKey(fromQ,fromR);
  visited[startKey]=0;
  costMap[startKey]=0;
  parent[startKey]=null;

  while(queue.length){
    const cur=queue.shift();
    for(const n of hexNeighbors(cur.q,cur.r)){
      const cell=S.map[hexKey(n.q,n.r)];
      if(!cell)continue;
      const mc=T_MOVE[cell.terrain];
      if(mc>=99)continue;
      const totalCost=cur.cost+mc;
      const k=hexKey(n.q,n.r);
      if(visited[k]!==undefined&&visited[k]<=totalCost)continue;
      if(totalCost>unit.move)continue;
      // Can't pass through enemy units
      const occ=S.units.find(u=>u.q===n.q&&u.r===n.r);
      if(occ&&occ.team!==unit.team)continue;
      // Can pass through friendly units but not stop on them
      visited[k]=totalCost;
      costMap[k]=totalCost;
      parent[k]=hexKey(cur.q,cur.r);
      queue.push({q:n.q,r:n.r,cost:totalCost});
    }
  }

  // Reconstruct path
  const targetKey=hexKey(toQ,toR);
  if(parent[targetKey]===undefined)return null; // no path

  const path=[];
  let current=targetKey;
  while(current){
    const [q,r]=current.split(',').map(Number);
    path.unshift({q,r,cost:costMap[current]||0});
    current=parent[current];
  }
  return path;
}

// [TASK 6] computeMaxReach: mark cells at the boundary of reachable area
function computeMaxReach(unit,costMap){
  const maxReach=new Set();
  if(!unit||unit.move<=0)return maxReach;
  for(const [k,cost] of Object.entries(costMap)){
    if(cost===unit.move&&k!==hexKey(unit.q,unit.r)){
      maxReach.add(k);
    }
  }
  return maxReach;
}

function combat(atk,def){
  const tDef=T_DEF[S.map[hexKey(def.q,def.r)]?.terrain||0]||0;
  const dmg=Math.max(1,atk.atk-def.def-tDef+Math.floor(Math.random()*4)-1);
  def.hp-=dmg;atk.attacked=true;atk.moved=true;atk.move=0;
  addLog(`${atk.name} \u2192 ${def.name}: ${dmg} урона`,atk.team==='player'?'player':'enemy');

  if(def.hp>0&&hexDist(atk.q,atk.r,def.q,def.r)<=def.range){
    const cdmg=Math.max(1,Math.floor(def.atk*0.6)-atk.def+Math.floor(Math.random()*2));
    atk.hp-=cdmg;
    addLog(`${def.name} контратакует: ${cdmg}`,def.team==='player'?'player':'enemy');
  }

  if(def.hp<=0){addLog(`${def.name} уничтожен!`,'system');S.units=S.units.filter(u=>u!==def);
    atk.xp+=10;checkLvl(atk);if(atk.team==='player')S.pp+=1;}
  if(atk.hp<=0){addLog(`${atk.name} уничтожен!`,'system');S.units=S.units.filter(u=>u!==atk);}
  if(S.selectedUnit&&S.selectedUnit.hp<=0)S.selectedUnit=null;
  clearHL();updateUI();checkVictory();
}

// [EFFECTS] Combat wrapper: intercepts combat calls to add hit/death visual effects
// Does NOT modify the original combat function internals
const _originalCombat = combat;
combat = function(atk, def) {
  const atkHpBefore = atk.hp;
  const defHpBefore = def.hp;
  const atkQ = atk.q, atkR = atk.r;
  const defQ = def.q, defR = def.r;
  const defColor = def.color;
  const atkColor = atk.color;
  _originalCombat(atk, def);
  // Hit effect on defender
  const dmgDealt = defHpBefore - def.hp;
  if (dmgDealt > 0) addEffect({type:'hit', q:defQ, r:defR, t:0, maxT:20, damage:dmgDealt});
  // Death effect on defender
  if (def.hp <= 0) {
    addEffect({type:'death', q:defQ, r:defR, t:0, maxT:25, color:defColor});
    if(def.team==='enemy') S.stats.unitsKilled++;
  }
  // Counterattack hit on attacker
  const counterDmg = atkHpBefore - atk.hp;
  if (counterDmg > 0 && atkHpBefore > 0) addEffect({type:'hit', q:atkQ, r:atkR, t:0, maxT:20, damage:counterDmg});
  // Death effect on attacker
  if (atk.hp <= 0) addEffect({type:'death', q:atkQ, r:atkR, t:0, maxT:25, color:atkColor});
};

function checkLvl(u){
  const need=u.level*15;
  if(u.xp>=need){u.level++;u.xp-=need;u.maxHp+=8;u.hp=Math.min(u.hp+8,u.maxHp);
    u.atk+=2;u.def+=1;addLog(`${u.name} \u2192 уровень ${u.level}!`,'system');}
}

// [PATCH 6] Улучшенный AI: перегенерация целей, пропуск мёртвых, безопасное продолжение
function enemyTurn(){
  if(S.phase==='gameover')return;
  S.phase='enemy';addLog('--- Ход противника ---','enemy');updatePhaseIndicator();
  const enemies=[...S.units.filter(u=>u.team==='enemy')];
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(e.hp<=0)continue;
    // [PATCH 6] Перегенерация целей после каждого действия
    const players=S.units.filter(u=>u.team==='player'&&u.hp>0);
    if(!players.length)break;
    let closest=null,cDist=Infinity;
    players.forEach(p=>{const d=hexDist(e.q,e.r,p.q,p.r);if(d<cDist){cDist=d;closest=p;}});
    if(!closest)continue;
    if(cDist<=e.range){
      combat(e,closest);
      // [PATCH 6] Если атакующий погиб при контратаке — пропустить
      if(e.hp<=0)continue;
    }else{
      const{moveCells}=findReachable(e);
      let best=null,bDist=Infinity;
      moveCells.forEach(k=>{const[cq,cr]=k.split(',').map(Number);
        const d=hexDist(cq,cr,closest.q,closest.r);if(d<bDist){bDist=d;best={q:cq,r:cr};}});
      if(best){if(best.q>e.q||(best.q===e.q&&best.r>e.r))e.facing=1;else e.facing=-1;e.q=best.q;e.r=best.r;e.moved=true;e.walkAnim=12;
        const targets=findAttackTargets(e);
        if(targets.length&&!e.attacked){
          combat(e,targets[0]);
          // [PATCH 6] Если атакующий погиб — не продолжать
          if(e.hp<=0)continue;
        }
      }
    }
    // [PATCH 6] Прервать цикл если gameover
    if(S.phase==='gameover')break;
  }
  // [PATCH 1] Таймер через _enemyTurnTimer для возможности отмены
  _enemyTurnTimer=setTimeout(()=>{
    _enemyTurnTimer=null;
    startPlayerTurn();
  },500);
}

// [PATCH 1] startPlayerTurn: очистка устаревших таймеров, guard gameover
function startPlayerTurn(){
  if(S.phase==='gameover')return;
  if(_enemyTurnTimer!==null){clearTimeout(_enemyTurnTimer);_enemyTurnTimer=null;}
  S.turn++;S.phase='player';
  S.buildings.forEach(b=>{b.recruitedThisTurn=false;});
  S.units.filter(u=>u.team==='player').forEach(u=>{u.moved=false;u.attacked=false;u.move=u.maxMove;});

  // [TECH TREE] Complete current research if enough PP accumulated
  if(S.currentResearch){
    const tech=TECHS[S.currentResearch];
    if(tech){
      S.researchProgress+=getSciencePerTurn();
      if(S.researchProgress>=tech.cost){
        completeResearch();
      }else{
        addLog(`${tech.name}: ${S.researchProgress}/${tech.cost} ОП`,'system');
      }
    }
  }

  let fg=0,fd=0;
  S.units.filter(u=>u.team==='player').forEach(u=>{
    const t=S.map[hexKey(u.q,u.r)]?.terrain;
    if(t===TERRAIN.DESERT)fg++;if(t===TERRAIN.PLAINS||t===TERRAIN.HILLS)fd++;
  });
  // ОП от зданий
  let buildingOP=0;
  S.buildings.forEach(b=>{buildingOP+=BT[b.type].opp;});

  S.res.gold+=fg+3;S.res.food+=fd+2;S.pp+=2+buildingOP;
  addLog(`--- Ход ${S.turn} ---`,'system');
  if(fg||fd||buildingOP)addLog(`+${fg+3} золота, +${fd+2} еды, +${2+buildingOP} ОП`,'player');

  // [TECH TREE] Tech bonuses to food and PP
  let foodBonus=0;
  if(S.researched.has('gathering'))foodBonus+=countTerrain(TERRAIN.PLAINS);
  if(S.researched.has('agriculture'))foodBonus+=2;
  if(foodBonus>0){S.res.food+=foodBonus;addLog(`+${foodBonus} еды (технологии)`,'player');}

  let ppBonus=0;
  if(S.researched.has('campfires'))ppBonus+=1;
  if(S.researched.has('religion'))ppBonus+=2;
  if(S.researched.has('education'))ppBonus+=2;
  if(S.researched.has('alchemy'))ppBonus+=3;
  if(ppBonus>0){S.pp+=ppBonus;addLog(`+${ppBonus} ОП (технологии)`,'player');}

  clearHL();S.selectedUnit=null;computeThreats();updateUI();
  // [TASK 9] Show turn start toast
  const income=projectIncome();
  showTurnToast(`Ход ${S.turn} | +${income.gold} золота, +${income.food} еды, +${income.pp} ОП`);
  updatePhaseIndicator();
}

// [PATCH 1] endTurn: фаза enemy-turn-pending + блокировка повторного запуска
function endTurn(){
  if(!isInputAllowed())return;
  S.phase='enemy-turn-pending';
  S.selectedUnit=null;clearHL();updatePhaseIndicator();
  S.units.filter(u=>u.team==='enemy').forEach(u=>{u.moved=false;u.attacked=false;u.move=u.maxMove;});
  // [PATCH 1] Отменить предыдущий таймер если вдруг остался
  if(_enemyTurnTimer!==null){clearTimeout(_enemyTurnTimer);_enemyTurnTimer=null;}
  _enemyTurnTimer=setTimeout(()=>{
    _enemyTurnTimer=null;
    enemyTurn();
  },200);
}

// [PATCH 3] canBuild: блокировать строительство при ЛЮБОМ юните на клетке
function canBuild(type,q,r){
  const cell=S.map[hexKey(q,r)];if(!cell)return false;
  if(cell.terrain===TERRAIN.MOUNTAIN||cell.terrain===TERRAIN.WATER)return false;
  if(S.buildings.find(b=>b.q===q&&b.r===r))return false;
  if(S.units.find(u=>u.q===q&&u.r===r))return false;  // [PATCH 3] любой юнит, не только вражеский
  // Радиус от замка
  const castle=S.buildings.find(b=>b.type==='castle');
  if(!castle)return false;
  if(hexDist(castle.q,castle.r,q,r)>3)return false;
  const cost=BT[type].cost;
  return S.res.gold>=cost.gold&&S.res.wood>=cost.wood;
}

function build(type,q,r){
  if(!canBuild(type,q,r))return false;
  const cost=BT[type].cost;
  S.res.gold-=cost.gold;S.res.wood-=cost.wood;
  S.buildings.push(makeBuilding(type,q,r));
  addLog(`Построено: ${BT[type].name} (${q},${r})`,'system');
  updateUI();return true;
}

const RES_NAMES = {gold:'золота',food:'еды',wood:'дерева',stone:'камня'};
function rName(r){return RES_NAMES[r]||r;}

function isHexFreeForSpawn(q,r){
  const cell=S.map[hexKey(q,r)];
  if(!cell)return false;
  if(T_MOVE[cell.terrain]>=99)return false;
  if(S.units.find(u=>u.q===q&&u.r===r))return false;
  if(S.buildings.find(b=>b.q===q&&b.r===r))return false;
  return true;
}

function findSpawnHex(bq,br){
  for(const n of hexNeighbors(bq,br)){
    if(isHexFreeForSpawn(n.q,n.r))return n;
  }
  for(const n2 of hexNeighbors(bq,br)){
    for(const n of hexNeighbors(n2.q,n2.r)){
      if(isHexFreeForSpawn(n.q,n.r))return n;
    }
  }
  return null;
}

function canRecruit(unitType,buildingQ,buildingR){
  const ut=UT[unitType];
  if(!ut)return false;
  if(ut.team!=='player')return false;
  if(ut.minEpoch>S.epoch)return false;
  const cost=ut.cost||{};
  for(const[res,amount] of Object.entries(cost)){
    if((S.res[res]||0)<amount)return false;
  }
  const spawnHex=findSpawnHex(buildingQ,buildingR);
  if(!spawnHex)return false;
  const building=S.buildings.find(b=>b.q===buildingQ&&b.r===buildingR);
  if(building&&building.recruitedThisTurn)return false;
  return true;
}

function getRecruitStatus(unitType,buildingQ,buildingR){
  const ut=UT[unitType];
  if(!ut)return {can:false,reason:'Неизвестный тип'};
  if(ut.team!=='player')return {can:false,reason:'Нельзя нанять'};
  if(!ut.cost)return {can:false,reason:'Нельзя нанять'};
  if(ut.minEpoch>S.epoch)return {can:false,reason:`Нужна Эпоха ${ut.minEpoch} (сейчас ${S.epoch})`};
  const cost=ut.cost||{};
  for(const[res,amount] of Object.entries(cost)){
    if((S.res[res]||0)<amount)return {can:false,reason:`Мало ${rName(res)}: нужно ${amount}, есть ${S.res[res]||0}`};
  }
  const spawnHex=findSpawnHex(buildingQ,buildingR);
  if(!spawnHex)return {can:false,reason:'Нет свободной клетки рядом'};
  const building=S.buildings.find(b=>b.q===buildingQ&&b.r===buildingR);
  if(building&&building.recruitedThisTurn)return {can:false,reason:'Наём уже произведён в этом ходу'};
  return {can:true,reason:''};
}

function recruitUnit(unitType,buildingQ,buildingR){
  if(!canRecruit(unitType,buildingQ,buildingR))return false;
  const ut=UT[unitType];
  const cost=ut.cost||{};
  for(const[res,amount] of Object.entries(cost)){
    S.res[res]-=amount;
  }
  const spawn=findSpawnHex(buildingQ,buildingR);
  if(!spawn)return false;
  const unit=makeUnit(unitType,spawn.q,spawn.r);
  unit.moved=true;unit.attacked=false;unit.move=0;
  S.units.push(unit);
  const building=S.buildings.find(b=>b.q===buildingQ&&b.r===buildingR);
  if(building)building.recruitedThisTurn=true;
  addEffect({type:'spawn',q:spawn.q,r:spawn.r,t:0,maxT:30,team:'player'});
  addLog(`Нанят: ${ut.name} (${spawn.q},${spawn.r}) — ${Object.entries(cost).map(([r,a])=>`${a} ${rName(r)}`).join(', ')}`,'player');
  clearHL();updateUI();
  return true;
}

// [PATCH 2] mousedown: guard gameover + isInputAllowed
canvas.addEventListener('mousedown',e=>{
  if(S.phase==='gameover')return;
  if(e.button===1||e.button===2){S.dragging=true;S.dragStart={x:e.clientX,y:e.clientY};
    S.camStart={x:S.cam.x,y:S.cam.y};e.preventDefault();return;}
  if(!isInputAllowed())return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left+S.cam.x;
  const my=e.clientY-rect.top+S.cam.y;
  const ox=canvas.width/2,oy=60;
  const hex=pixelToHex(mx-ox,my-oy);
  if(S.map[hexKey(hex.q,hex.r)])handleClick(hex.q,hex.r);
});

canvas.addEventListener('mousemove',e=>{
  if(S.dragging){S.cam.x=S.camStart.x-(e.clientX-S.dragStart.x);
    S.cam.y=S.camStart.y-(e.clientY-S.dragStart.y);clampCam();return;}
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left+S.cam.x;
  const my=e.clientY-rect.top+S.cam.y;
  const ox=canvas.width/2,oy=60;
  const hex=pixelToHex(mx-ox,my-oy);
  const cell=S.map[hexKey(hex.q,hex.r)];
  // [TASK 2+3] Set hover hex for highlight system
  if(cell){
    S.hoverHex={q:hex.q,r:hex.r};
  }else{
    S.hoverHex=null;
    // [TASK 6] Clear path highlights when mouse leaves map
    S.pathHighlights=new Set();S.pathCostMap={};
  }

  // [TASK 6] Compute path preview on hover when unit is selected
  if(S.selectedUnit&&S.hoverHex&&S.moveHighlights.has(hexKey(S.hoverHex.q,S.hoverHex.r))){
    const path=findPath(S.selectedUnit.q,S.selectedUnit.r,S.hoverHex.q,S.hoverHex.r,S.selectedUnit);
    if(path&&path.length>1){
      const newPathHL=new Set();
      const newPathCost={};
      path.forEach(p=>{
        const k=hexKey(p.q,p.r);
        newPathHL.add(k);
        newPathCost[k]=p.cost;
      });
      S.pathHighlights=newPathHL;
      S.pathCostMap=newPathCost;
    }else{
      S.pathHighlights=new Set();
      S.pathCostMap={};
    }
  }else if(S.selectedUnit&&S.hoverHex&&!S.moveHighlights.has(hexKey(S.hoverHex.q,S.hoverHex.r))){
    // Hovering over non-reachable cell — clear path
    S.pathHighlights=new Set();
    S.pathCostMap={};
  }

  if(cell){
    const unit=S.units.find(u=>u.q===hex.q&&u.r===hex.r);
    const bld=S.buildings.find(b=>b.q===hex.q&&b.r===hex.r);
    // [TASK 1] Layered tooltip: unit -> building -> tile with separators
    let txt='';
    if(unit){
      const teamTag=unit.team==='player'?'[Союз]':'[Враг]';
      txt+=teamTag+' '+unit.name+' HP:'+unit.hp+'/'+unit.maxHp+' ATK:'+unit.atk+' DEF:'+unit.def;
    }
    if(bld){
      if(txt)txt+=' ─ ';
      txt+=bld.name+': '+BT[bld.type].desc;
      if(BT[bld.type].canRecruit)txt+=' [Найм: R]';
    }
    {
      if(txt)txt+=' ─ ';
      txt+=T_NAMES[cell.terrain]+' ('+hex.q+','+hex.r+')';
      const mc=T_MOVE[cell.terrain];const df=T_DEF[cell.terrain];
      txt+=' Ход:'+(mc>=99?'—':mc)+' Защ:'+(df>0?'+':'')+df;
    }
    // [TASK 6] Show total move cost in tooltip if path preview is active
    if(S.selectedUnit&&S.pathHighlights.size>0){
      const hKey=hexKey(hex.q,hex.r);
      if(S.pathCostMap[hKey]!==undefined){
        txt+=' ─ Путь: '+S.pathCostMap[hKey]+'/'+S.selectedUnit.move;
      }
    }
    const tt=document.getElementById('tooltip');tt.textContent=txt;tt.style.display='block';
    tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY+12)+'px';
  }else document.getElementById('tooltip').style.display='none';
});

canvas.addEventListener('mouseup',()=>S.dragging=false);
canvas.addEventListener('mouseleave',()=>{S.dragging=false;S.hoverHex=null;S.pathHighlights=new Set();S.pathCostMap={};document.getElementById('tooltip').style.display='none';});

// [TECH TREE] Click handler for tech tree canvas
document.getElementById('tech-canvas').addEventListener('click',function(e){
  const rect=this.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const nodes=window._techNodePositions||{};
  Object.values(nodes).forEach(node=>{
    if(mx>=node.x&&mx<=node.x+node.w&&my>=node.y&&my<=node.y+node.h){
      if(canResearch(node.tech.id)){
        startResearch(node.tech.id);
        renderTechTree();
      }
    }
  });
});
